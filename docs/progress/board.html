<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Norfold progress board</title>
<style>
:root { color-scheme: light dark; --bg: #f4f3ef; --surface: #fff; --text: #202321; --muted: #505954; --line: #c9ceca; --accent: #784111; --focus: #155a9c; }
@media (prefers-color-scheme: dark) { :root { --bg: #181c1a; --surface: #222824; --text: #edf1ed; --muted: #c0cbc2; --line: #59665d; --accent: #ffc487; --focus: #8ac5ff; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
header, main { max-width: 1600px; margin: auto; padding: 0 24px; }
header { padding-top: 28px; }
h1 { margin: 0; font-size: 1.8rem; line-height: 1.2; letter-spacing: -.03em; }
header p { color: var(--muted); margin: 8px 0 22px; }
code, .id, .count, .priority { font-variant-numeric: tabular-nums; }
code { overflow-wrap: anywhere; }
.filters { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; padding: 16px 0; border-block: 1px solid var(--line); }
.field { display: grid; gap: 4px; min-width: 130px; flex: 1 1 130px; font-size: .85rem; font-weight: 650; }
.field.search { flex: 2 1 240px; }
input, select { width: 100%; min-height: 42px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); color: var(--text); font: inherit; }
input[type=checkbox] { width: 18px; min-height: 18px; height: 18px; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; min-height: 42px; cursor: pointer; }
select, summary, button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 22px; align-items: start; padding: 24px 0 48px; }
.column { min-width: 0; }
.column > summary { display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 2px solid var(--text); list-style: none; }
.column > summary::-webkit-details-marker { display: none; }
.column > summary::before { content: '−'; font-size: 1.2rem; width: 1em; }
.column:not([open]) > summary::before { content: '+'; }
h2 { font-size: 1rem; margin: 0; text-transform: capitalize; }
.count { margin-left: auto; color: var(--muted); }
.cards { display: grid; gap: 10px; padding-top: 12px; }
article { min-width: 0; padding: 14px; background: var(--surface); border: 1px solid var(--line); overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8rem; color: var(--muted); }
.priority { color: var(--accent); font-weight: 750; }
h3 { font-size: 1rem; line-height: 1.35; margin: 7px 0; }
.labels { margin: 6px 0; font-size: .82rem; color: var(--muted); }
.description { margin-top: 8px; font-size: .88rem; }
.description summary { min-height: 36px; color: var(--muted); }
.description p { white-space: pre-wrap; margin: 8px 0 0; }
.empty { color: var(--muted); font-size: .9rem; }
@media (max-width: 500px) { header, main { padding-left: 16px; padding-right: 16px; } .board { gap: 16px; } }
</style>
</head>
<body>
<header>
  <h1>Progress board</h1>
  <p>Generated snapshot, view only. Refresh with <code>node scripts/progress-board.mjs</code>.</p>
</header>
<main>
  <section class="filters" aria-label="Filter issues">
    <label class="field search">Search<input id="search" type="search" placeholder="Search issues"></label>
    <label class="field">Priority<select id="priority"><option value="">All priorities</option></select></label>
    <label class="field">Label<select id="label"><option value="">All labels</option></select></label>
    <label class="field">Type<select id="type"><option value="">All types</option></select></label>
    <label class="check"><input id="closed" type="checkbox"> Show closed</label>
  </section>
  <div id="board" class="board" aria-live="polite"></div>
  <noscript>JavaScript is required to display this snapshot.</noscript>
</main>

<script type="application/json" id="board-data">[{"id":"1f43208","title":"Rework onboarding into a text-led, fast flow","description":"Owner: 'it's not landing, it's onboarding ... good and proper flow. Not faked with images ... texts properly with good visuals and animations fast and efficient. Not something to introduce lag.' Text-led, no fabricated imagery, transform/opacity only, uiMotion tokens, reduced motion honoured, 320dp clean, finish action must state that signing in comes next.","acceptance_criteria":"Onboarding + PublicWelcome tests green; tsc exit 0; eslint clean; rendered at 320dp in light/dark/AMOLED/125%.","status":"closed","priority":1,"issue_type":"feature","labels":[],"created_at":"2026-11-11T00:56:37+06:00","updated_at":"2026-11-11T01:25:11+06:00"},{"id":"bf3c5ef","title":"Bump app version to 0.15.0-beta.2 for a new APK","description":"Owner needs a new APK; versionName comes from apps/mobile/package.json and versionCode from git history, so a real version change is required or the new APK is indistinguishable.","acceptance_criteria":"Both package.json files read 0.15.0-beta.2; shared build + mobile typecheck pass; android/build.gradle unchanged because it derives both values.","status":"closed","priority":1,"issue_type":"task","labels":[],"created_at":"2026-11-11T00:56:37+06:00","updated_at":"2026-11-11T01:24:38+06:00"},{"id":"d5884a7","title":"Test account password rejected (norfold.app@gmail.com)","description":"Sign-in on the local build returned 'We couldn't sign you in.' Supabase is reachable (unauthenticated REST returns the expected 401), so this is credentials, not connectivity. Not retried to avoid lockout. Not verified on findbackapp.social because the in-app browser holds the owner's Admin session and signing out would destroy it.","acceptance_criteria":"Password confirmed or reset; sign-in succeeds; then the Dislike E2E check can run.","status":"open","priority":1,"issue_type":"bug","labels":[],"created_at":"2026-11-11T00:56:38+06:00","updated_at":"2026-11-11T21:12:38+06:00"},{"id":"ffee86d","title":"Verify Dislike end-to-end with a real signed-in account","description":"Server guard is live (migration 20261110010000 applied; deployed findback_react_client accepts LIKE/DISLIKE, comments still LIKE-only). Client is complete and unit-tested. Still unproven: an actual Dislike tap on a real account against the hosted backend. Blocked on credentials.","acceptance_criteria":"Signed in as a test account on a build containing c359c378, tapping Dislike writes a DISLIKE row and the count increments; tapping again clears it.","status":"closed","priority":1,"issue_type":"task","labels":[],"created_at":"2026-11-11T00:56:38+06:00","updated_at":"2026-11-11T01:19:52+06:00"},{"id":"3d552f1","title":"Store disposable test-account credentials outside the repo","description":"Owner explicitly authorised saving the throwaway account password. Stored at ~/.config/opencode/secrets/norfold-test-account.md, deliberately outside every git repo so it cannot be committed, and never in a Beads issue because Beads syncs through the git remote.","acceptance_criteria":"File exists outside the repo; nothing in the repo references the value.","status":"closed","priority":2,"issue_type":"task","labels":[],"created_at":"2026-11-11T00:56:38+06:00","updated_at":"2026-11-11T01:25:12+06:00"},{"id":"01f4f61","title":"Beads containment policy","description":"bd init made its own commit, appended to the tracked AGENTS.md, and installed Claude/Codex/Cursor integration plus git hooks. All reverted: AGENTS.md restored, foreign dirs deleted, core.hooksPath unset, only .beads kept. Policy: never run bd init in this repo again; no agent-integration directories; no git hooks. If Beads misbehaves again, fall back to the kanban JSON snapshot.","acceptance_criteria":"AGENTS.md contains no Beads block; no .claude/.codex/.cursor/.agents; core.hooksPath unset.","status":"closed","priority":2,"issue_type":"task","labels":[],"created_at":"2026-11-11T00:56:39+06:00","updated_at":"2026-11-11T01:20:04+06:00"},{"id":"1e4b5ba","title":"Single-file kanban progress board","description":"Self-contained docs/progress/board.html generated from .beads/issues.jsonl by scripts/progress-board.mjs. No CDN, no build step, no overlay; filter/search/collapse with localStorage; regenerable and idempotent.","acceptance_criteria":"Opens by double-click; idempotent regeneration; embedded JSON parses; no subresource fetches.","status":"closed","priority":2,"issue_type":"feature","labels":[],"created_at":"2026-11-11T00:56:39+06:00","updated_at":"2026-11-11T01:20:05+06:00"},{"id":"f9f7101","title":"Confirm the 3 failing vitest files are Windows temp-cleanup flake","description":"Full suite in apps/mobile gave 3 failed files / 5 failed tests out of 8032. The one identified failure is EPERM on C:\\Users\\...\\Temp\\findback-sqlite-* at sqliteHistory.test.ts:165 (rmSync on a still-open handle). The other two files were lost when the first run was truncated to 40 lines. A later root-level run was invalid (it picked up Deno Edge Function tests).","acceptance_criteria":"Re-run identifies all three files; each passes in isolation or is proven environmental; no real regression.","status":"closed","priority":2,"issue_type":"bug","labels":[],"created_at":"2026-11-11T00:56:39+06:00","updated_at":"2026-11-11T00:57:12+06:00"},{"id":"2a3a239","title":"Rubric #7 - 'Rate your experience with Norfold' control","description":"Rubric #3 is now source-complete. #7 remains: rating a participant after a recovery is not the same as rating the app. Proposal was a separate per-account, editable rating with a server-computed average - must not revive findback_rate_client, which is service_role-only.","acceptance_criteria":"One rating per account, editable, average computed server-side, no client-supplied target.","status":"open","priority":2,"issue_type":"feature","labels":[],"created_at":"2026-11-11T00:56:40+06:00","updated_at":"2026-11-11T10:40:54+06:00"},{"id":"7b80308","title":"Deploy current main to findbackapp.social","description":"Remote main is 14283fa1 but the served site still shows the pre-change UI (old like count, no Dislike). The web deployment must run for the Like/Dislike pair to be live on the real site.","acceptance_criteria":"web.yml succeeds for the current HEAD; served bundle shows the Like/Dislike pair; version.json matches HEAD.","status":"closed","priority":2,"issue_type":"task","labels":[],"created_at":"2026-11-11T00:56:40+06:00","updated_at":"2026-11-11T01:19:53+06:00"},{"id":"13916f2","title":"Implement the public landing review (owner decision pending)","description":"docs/design/LANDING-REVIEW.md concluded: keep the entry architecture, fix two things - the four-scene hero plus six chapters explain the same journey twice, and all five 'Get started' CTAs hide the account step (PublicWelcome.tsx:41-46 completes onboarding then navigates to /auth). Not implemented: renaming only PublicWelcome leaves Onboarding's own 'Get started' inconsistent, while renaming Onboarding.tsx also changes the native first-run flow. Needs an owner decision on copy and structure.","acceptance_criteria":"Owner approves the proposed structure/copy; change lands with a rendered review at 320dp in light/dark/AMOLED/125%.","status":"open","priority":2,"issue_type":"feature","labels":[],"created_at":"2026-11-11T00:56:40+06:00","updated_at":"2026-11-11T01:20:05+06:00"},{"id":"55c2635","title":"Enable write-mode Supabase MCP (needs interactive auth)","description":"supabase-write is declared in opencode.json. Adding project_ref to the remote MCP URL invalidated the OAuth session and removed all Supabase tools until reverted, so project scoping must be paired with opencode mcp auth supabase-write. Read-only server is currently restored and working.","acceptance_criteria":"opencode mcp auth supabase-write completes; apply_migration is available; read server also reachable.","status":"closed","priority":3,"issue_type":"task","labels":[],"created_at":"2026-11-11T00:56:41+06:00","updated_at":"2026-11-11T06:56:20+06:00"},{"id":"388d187","title":"Fix v0.15.0-beta.1 tag drift","description":"The tag targets 340e201e while the served manifest named 36dc9996; HEAD is now 14283fa1. Tag/publish policy is owner-owned - do not move a published tag without instruction.","acceptance_criteria":"Owner decides whether to re-tag; served version.json matches the released commit.","status":"open","priority":3,"issue_type":"task","labels":[],"created_at":"2026-11-11T00:56:41+06:00","updated_at":"2026-11-11T00:57:12+06:00"},{"id":"6dd3fd9","title":"Remove or wire dead askAiHelp service","description":"services/auth.ts:697 defines askAiHelp and it is tested, but no screen calls it - screens/Help.tsx uses ChatController instead. Either delete it with its tests or document why it is retained.","acceptance_criteria":"No untested-by-usage dead service, or a recorded reason for keeping it.","status":"closed","priority":3,"issue_type":"task","labels":[],"created_at":"2026-11-11T00:56:42+06:00","updated_at":"2026-11-11T07:04:06+06:00"},{"id":"48bae9c","title":"Full suite was skipped before committing a copy change","description":"The onboarding copy rework changed the public heading and the finish button label, then committed after running only the Onboarding and PublicWelcome suites. CI caught 8 failures in App.routes.test.tsx; the full suite then exposed 2 more in Guards.test.tsx and QaKAuthRouting.test.tsx, all asserting 'Lost something?' or clicking a button named /get started/i.","acceptance_criteria":"every suite asserting changed consumer copy is updated in the same change, and the full mobile suite runs before the commit rather than after.","status":"closed","priority":2,"issue_type":"bug","labels":[],"created_at":"2026-11-11T01:06:50+06:00","updated_at":"2026-11-11T01:06:51+06:00"},{"id":"c04d7a2","title":"Disable the unused beads MCP server","description":"The beads MCP server is still declared and shows connected in opencode mcp list, but .beads/ was deleted when the tracker moved to git-bug. Any agent that calls it will fail or create a stray database.","acceptance_criteria":"the beads server entry is removed or disabled in ~/.config/opencode/opencode.json, and opencode mcp list no longer lists it.","status":"closed","priority":3,"issue_type":"task","labels":[],"created_at":"2026-11-11T06:56:20+06:00","updated_at":"2026-11-11T06:59:59+06:00"},{"id":"bbcf4a6","title":"Search lane — adversarial review findings (HEAD f572ff38)","description":"Source-level review of SearchScreen, AdvancedSearchFilters, SearchNearby,\nHomeFilterChips, useFeed, useUrlParam, posts.ts, nearby/location adapters,\nplaceScope, nlFilters, liveNarrowTasks, extractSearchFilters. No runtime,\nserver or rendered-a11y verification.\n\nACCEPTED FINDINGS\n\n1. [medium] SearchNearby.tsx:24-34,45-47 — enable() closes over `radius` when the\n   location request starts. If the reader changes Distance while the fix is\n   pending, line 33 writes the OLD radius back into the near param and the\n   nearby session. A slow permission prompt silently undoes the newer choice and\n   searches the wrong area. Fix: read the latest radius when the fix resolves, or\n   disable radius changes while locating.\n\n2. [medium] SearchScreen.tsx:485-486,686-702 — when no LOADED report matches a\n   place but more pages exist, the heading asserts \"No report in \u003cplace> yet\"\n   while the subtitle admits a match may exist. Fix: say \"No matching reports\n   loaded yet\" while hasMore is true.\n\n3. [medium] SearchScreen.tsx:685-712 with useFeed.ts:203-209,232-239 — when\n   \"Show more loads\" fails after the place filter excluded every loaded item, the\n   error branch bypasses the place-empty branch, PostList renders empty, and its\n   retry is `refresh` (resets the cursor) rather than retrying the failed page.\n   Fix: keep the place-empty context and offer a page-specific retry using\n   loadMore.\n\n4. [low] AdvancedSearchFilters.tsx:282-287,300-310 — filter-chip accessible names\n   are generic (\"Remove category filter\", \"Remove nearby filter\") and omit the\n   selected value. Fix: include the value, e.g. \"Remove category filter:\n   Electronics\".\n\n5. [low] SearchScreen.test.tsx:92-104,131-147,324-359 and\n   HomeNearby.test.tsx:108-115 — filter tests assert mocked fetch arguments while\n   the default response is empty, so they pass even if the search returns nothing.\n   SearchScreen.test.tsx:1137-1153 asserts only that the next page was requested,\n   not that a matching second-page result renders. Fix: fixture real rows and\n   assert displayed results, including a later-page match and a failed-page retry.\n\nREFUTED (not a defect)\n\n- \"Smart Search privacy contract is violated by the ordinary fallback.\"\n  liveNarrowTasks.ts:4-9 promises only that the NARROW-TASK helper has no cloud\n  fallback, and the same comment says \"the ordinary non-AI path keeps working\".\n  SearchScreen.tsx:287-293 sets the query to the text the reader typed, which is\n  ordinary search. No user-facing copy claims Smart Search is device-local;\n  LocalIntelligence.tsx:13 says \"Normal search works without this helper.\"\n  Verified against source at f572ff38.\n\nCLAIMS TO RECONCILE\n\n- useUrlParam.ts:4-14 says the URL param is \"the shareable source of truth\", but\n  the hook reads it only on mount; later URL changes are not read back into state.\n- Place search is live but filters loaded pages on-device\n  (SearchScreen.tsx:471-482), not the full server result set — copy should not\n  imply otherwise.","acceptance_criteria":"","status":"closed","priority":3,"issue_type":"defect","labels":["area:search"],"created_at":"2026-11-11T07:12:32+06:00","updated_at":"2026-11-11T10:04:06+06:00"},{"id":"9adebdd","title":"AGENTS.md rule #2 names the wrong enforcement script (owner decision needed)","description":"FOUND BY: web/deploy adversarial review, HEAD f572ff38.\n\nTHE MISMATCH\n\nAGENTS.md hard rule #2 requires: \"post-build proof via\nscripts/check-release-config.mjs\".\n\nThat script's own first line disagrees:\n  scripts/check-release-config.mjs:1\n  \"Strict release configuration preflight (release.yml only - never CI).\"\n\nIt is a PREFLIGHT. Its --apk mode inspects Google BuildConfig (Web client id,\nno secret shapes), not the packaged Supabase URL/key\n(scripts/check-release-config.mjs:16-18,177-193). In android-builds.yml it runs\nat :141, BEFORE the web build at :170.\n\nTHE ACTUAL CHAIN THAT ENFORCES THE RULE\n\n1. Preflight, every build path: vite.config.ts:76-83 spawns\n   `check-mobile-build-config.mjs --preflight` on any `vite build`, so a direct\n   `npm run build` cannot bypass it. It fails closed on missing, empty,\n   placeholder and malformed effective URL/key\n   (scripts/check-mobile-build-config.mjs:31-52). Local canonical SUPABASE_*\n   values can satisfy it when the literal VITE_* names are absent.\n2. Post-build, web: .github/workflows/web.yml:151 runs\n   `check-mobile-build-config.mjs --assets apps/mobile/dist/assets` plus the\n   drive, klipy and web-association checks.\n3. Post-build, Android: .github/workflows/android-builds.yml:176 runs the same\n   `--assets` check before symbols are stripped and the APK is packaged.\n4. Release: scripts/check-release-config.mjs does run, as a preflight.\n\nCONCLUSION\n\nThe rule's INTENT is met and is arguably enforced better than the wording says:\nthe artifact is checked for the baked config on both distributable paths. What is\nwrong is the sentence, and that matters because a future agent reading rule #2\nwill either look for a gate in a script that disclaims it, or \"fix\" the wrong\nfile.\n\nNOT CHANGED\n\nAGENTS.md was not edited. The global contract says an automated job must not\nrewrite a project AGENTS.md, and this is the owner's text to amend.\n\nOWNER DECISION\n\nEither (a) rewrite rule #2 to name check-mobile-build-config.mjs --preflight and\n--assets as the gate and check-release-config.mjs as the release preflight, or\n(b) keep the wording and add a --post-build mode to check-release-config.mjs that\nperforms the asset assertion, so the named script really is the gate.\n\nEvidence: no functional gap found. Direct build, web deploy and Android packaging\neach run a gate; none can produce a distributable artifact with a missing or\nplaceholder Supabase URL.","acceptance_criteria":"","status":"open","priority":2,"issue_type":"decision","labels":["area:deploy","area:docs"],"created_at":"2026-11-11T07:19:12+06:00","updated_at":"2026-11-11T07:19:12+06:00"},{"id":"d7bbf9a","title":"Chat consolidation is not a safe upgrade on a populated legacy deployment","description":"FOUND BY: backend/RLS adversarial review, HEAD f572ff38.\n\nTHE RISK\n\nsupabase/migrations/20261029020000_chat_r4_consolidation.sql:21-58 deliberately\naborts when chat rows, storage objects or message reports exist. It then drops\nthe legacy chat tables and columns at :73-89 and :111-112.\n\nThat prevents silent deletion, which is correct. It is NOT a safe upgrade path\nfor any deployment that still holds legacy chat data: the migration can never\nsucceed there, so the schema cannot advance past it. It is also not generally\nrerunnable after success, because the guard requires the legacy tables to exist.\n\nSCOPE\n\nWhether any actual deployment holds pre-consolidation chat data was not\nchecked. The hosted schema head was not queried in this review. This is a\nsource-identified upgrade-path risk, not an observed failure.\n\nWHAT WOULD CLOSE IT\n\nFor any deployment that has not applied the migration and holds legacy data:\nprepare and verify a separate non-destructive transition and backfill before\nadvancing. Do not edit the applied migration; fix forward with a new one.\nConfirm the hosted migration head and whether the guard would abort before\ndispatching backend-deploy.\n\nLABELS\n\np2 type:decision area:backend area:deploy","acceptance_criteria":"","status":"open","priority":2,"issue_type":"decision","labels":["area:backend","area:deploy"],"created_at":"2026-11-11T07:52:09+06:00","updated_at":"2026-11-11T07:52:09+06:00"},{"id":"e52e518","title":"Local model download: artifact is reachable; UI can hide the action silently","description":"FOUND BY: read-only download-path diagnosis + a live HEAD request, HEAD f572ff38.\n\nVERIFIED (fresh, this session)\n\n- Needle pin: https://huggingface.co/Cactus-Compute/needle3/resolve/c7c415a3d1b3d929014bc6e866d51ebb971f7089/needle3.cact\n- HEAD with a normal user agent: HTTP 200, no redirect, content-length 35335380,\n  Accept-Ranges: bytes, ETag equal to the pinned SHA-256.\n  So the URL, size and redirect policy are NOT the failure.\n- ModelDownloadPlugin is registered in MainActivity.onCreate (:29) before\n  super.onCreate (:44) and implements startDownload\n  (ModelDownloadPlugin.kt:170-225) with HTTPS, size and checksum enforcement\n  (:465-524, :580-585).\n- Android manifest declares INTERNET; no storage permission or foreground\n  service is needed for an app-private filesDir download.\n- USE embeddings are bundled at build time, not downloaded at runtime\n  (scripts/fetch-use-model.mjs:21-27, android/app/build.gradle:269-274).\n- Web has no download by design: destinations.ts:165-187 is Android-only and\n  App.tsx:271-273 wraps the routes in NativeOnly, which redirects to Settings.\n\nDEFECTS THAT CAN MAKE THE BUTTON \"NOT WORK\"\n\n1. [medium] The action is hidden, never explained. LocalSearchHelperRow renders\n   Download only when phase === ready, Android, descriptor present, compatible\n   device, descriptor.downloadable, and view.primary non-null\n   (DownloadedModels.tsx:37-42, 88-95). A failed ABI query becomes an empty\n   cached list (applicationAi.ts:290-301, 310-323), which reads as\n   \"Unavailable on this device\" with no retry. Only arm64-v8a qualifies\n   (modelDescriptors.ts:213-219).\n2. [medium] Runtime availability is not probed. bridges() only checks that the\n   TypeScript bridge object exists (applicationAi.ts:203-205, 283-284);\n   compatibilityOf trusts that boolean (:142-153) while the real native\n   isNeedleAvailable() call happens only at engine load (:535-550,\n   needle/native.ts:39-45). A build whose JNI runtime is broken can offer and\n   complete a download that can never be used.\n3. [low] storage-unverified offers removal only; there is no retry for the\n   readiness probe (localIntelligenceView.ts:45-65).\n\nNOT VERIFIED\n\nOwner's installed APK version, device ABI, free space, bridge/JNI state, and the\nactual tap outcome. No device or app run was performed. Which condition caused\nthe owner's report cannot be established without that state.\n\nLABELS\n\np2 type:defect area:mobile area:ai","acceptance_criteria":"","status":"closed","priority":2,"issue_type":"defect","labels":["area:ai","area:mobile"],"created_at":"2026-11-11T07:55:52+06:00","updated_at":"2026-11-11T10:03:34+06:00"},{"id":"a3d6bcb","title":"Enable armeabi-v7a for the local model; x86_64 is not possible upstream","description":"WHY THE GATE EXISTS\n\nThe Needle engine is a prebuilt static archive (libneedle.a) linked into a JNI\nbridge. CMake builds the bridge only for an ABI whose archive was fetched\n(apps/mobile/android/app/src/main/cpp/CMakeLists.txt:12-24), and\nscripts/fetch-needle-model.mjs:75-83 pins exactly one ABI: arm64-v8a.\n\nUPSTREAM ABI INVENTORY (verified against the pinned revision tree API)\n\nCactus-Compute/needle3 @ c7c415a3d1b3d929014bc6e866d51ebb971f7089 publishes:\n  android-arm64, android-armv7, android-riscv64, ios-*, linux-*, macos-*,\n  windows-*, wasm, wasm-component, tvos-*, watchos-*, python, tokenizer\n\nThere is NO android-x86_64 directory. The apk's x86_64 split therefore cannot\never load Needle: the only x86_64 archive is linux-x86_64, a desktop\nglibc/libstdc++ build that does not link against Bionic.\n\nACTION 1 - armeabi-v7a is available and should be enabled\n\n  dir:      android-armv7\n  lib:      libneedle.a  1646250 bytes\n  lib sha:  8cb5af3c2a7e6ad55a1fe94cb9b6c012b40ae921aae2981594362389872fa7c0\n  header:   needle.h  3322 bytes\n  hdr sha:  90f347f9dca1199de79967ab199a56e0588bd473fe306051f8d80d146976a324\n            (byte-identical to the arm64 header: same HF oid 9b404d84...)\n\nThe APK already produces an armeabi-v7a split (android/app/build.gradle:193);\nit simply has no bridge and hides the model.\n\nACTION 2 - stop hiding the action silently (all devices)\n\n- A failed ABI query currently becomes an empty list, which reads as\n  \"Unavailable on this device\" with no retry (applicationAi.ts:290-301,\n  310-323).\n- Runtime availability is not probed: bridges() checks only that the TS bridge\n  object exists (applicationAi.ts:203-205, 283-284) while the real native\n  isNeedleAvailable() runs at engine load (:535-550).\n- Say which devices can run it instead of an unexplained absence.\n\nNOT POSSIBLE WITHOUT A NEW UPSTREAM ARTEFACT\n\nx86_64 Android (emulators, x86 tablets, x86 Chromebooks) has no engine. Do not\ndownload 35 MB there and fail at load.\n\nVERIFICATION BOUNDARY\n\nNo local Android build is permitted on this machine, so the armv7 link can only\nbe proven by the Android CI job. Land the pin change and the UI change together,\nthen read the CI result; do not claim armv7 works before that build is green.\n\nLABELS\n\np2 type:feature area:mobile area:ai","acceptance_criteria":"","status":"closed","priority":2,"issue_type":"feature","labels":["area:ai","area:mobile"],"created_at":"2026-11-11T08:00:21+06:00","updated_at":"2026-11-11T08:02:33+06:00"},{"id":"df96cc8","title":"Two timing-sensitive tests flake when the full suite runs under load","description":"fixture.test.tsx 'renders the route shell with a section index' timed out at 20s and Home.test.tsx 'hands the exiting trigger''s slot to the filter button for the whole swap' collected 2 transition samples where it needs 3, both during a full-suite run on an 11 GiB machine. Both pass three times out of three when run alone from apps/mobile. Neither was reproduced in isolation, so the failure mode is contention, not logic.\n\nDo not fix this by raising the timeout or relaxing the sample count - that would hide a real timing assumption. The correct fix is either to make each test deterministic (drive the transition explicitly rather than sampling frames) or to stop sampling. Recorded so a CI flake, if it appears, is not mistaken for a regression.","acceptance_criteria":"","status":"open","priority":3,"issue_type":"defect","labels":["area:test"],"created_at":"2026-11-11T09:37:40+06:00","updated_at":"2026-11-11T09:37:50+06:00"},{"id":"3bca9d5","title":"migration_parity test fails on a Windows checkout but passes in CI","description":"supabase/tests/migration_parity.test.mjs fails 14 assertions on this machine and passes in CI. Verified not caused by any recent change: the same file fails identically at HEAD f572ff38 with the two new untracked migrations moved aside, and CI''s SQL and test jobs are green.\n\nTwo distinct failure shapes appear locally: 'Unmodelled dynamic function ACL' thrown by the static model, and newline-sensitive assertions whose actual/expected differ only by CRLF. The likely cause is the checkout''s CRLF working tree versus CI''s LF checkout, but that mechanism was not proven, so it is recorded rather than asserted.\n\nNot a product defect and not a gate on this machine; the app gate is the mobile suite, typecheck, lint and build. Recorded so a future agent does not mistake it for a regression or, worse, 'fix' the test to match Windows line endings.","acceptance_criteria":"","status":"closed","priority":3,"issue_type":"defect","labels":["area:tooling"],"created_at":"2026-11-11T09:37:40+06:00","updated_at":"2026-11-11T10:40:54+06:00"},{"id":"80effb8","title":"findbackapp.social has DKIM and DMARC but no SPF record","description":"Brevo domain verification is present (brevo-code TXT), DKIM is published at brevo1._domainkey and brevo2._domainkey as CNAME-based selectors, and DMARC exists at p=none pointing rua at Brevo.\n\nSPF is missing: there is no v=spf1 TXT record at the apex. DMARC can still pass on DKIM alignment alone, but receivers weight SPF and this is a one-line fix.\n\nAdd TXT at the apex: v=spf1 include:spf.brevo.com ~all. Only one SPF record may exist on a domain, so if any other sender is ever added it must be merged into the same record rather than added as a second one. The sender address in Supabase is still sheikhti1205@gmail.com with the display name FindBack; both should become noreply@findbackapp.social and Norfold once the domain is verified.","acceptance_criteria":"","status":"open","priority":2,"issue_type":"defect","labels":["area:infra"],"created_at":"2026-11-11T21:12:15+06:00","updated_at":"2026-11-11T21:12:39+06:00"},{"id":"e3e7fcf","title":"Telegram account linking: login, phone verification and unlink","description":"Owner direction: use Telegram for phone verification, with unlinking available both in the app and from the bot. Bot @Norfold_auth_bot (id 8438990182) is live and answers the API; its previous webhook pointed at a different Supabase project (libvhznygsoppyfhucpt) and returned 410, so it was deleted and nothing is wired.\n\nA Telegram bot cannot see a phone number unless the user taps a request_contact button, and then Telegram supplies the sender's own number. That is the verification mechanism, not the Login Widget, which carries no phone.\n\nThree lanes in parallel: database contract (telegram_login_tokens, telegram_links, six RPCs), Edge Function telegram-auth-webhook plus a manual deploy flag, and the app settings surface. Deployment needs TELEGRAM_WEBHOOK_SECRET and TELEGRAM_BOT_TOKEN set as Supabase function secrets.","acceptance_criteria":"","status":"open","priority":2,"issue_type":"task","labels":["area:auth","feature"],"created_at":"2026-11-11T21:12:15+06:00","updated_at":"2026-11-11T21:12:38+06:00"},{"id":"9b431a8","title":"Email OTP length is 8 in the project but the product wants 6","description":"A real recovery email delivered an eight-digit code. The owner wants six digits for every scenario, which is a Supabase project setting (Authentication - Providers - Email - Email OTP length), not code.\n\nThe client no longer hardcodes any length: validation accepts 6-10 digits, no user-visible copy names a digit count, inputs allow 10 characters, and diagnostics redaction covers 6-10 so a longer code cannot survive into a support bundle.\n\nLowering the project setting to 6 still needs the dashboard or a Management API token; no access token is present on this machine.","acceptance_criteria":"","status":"open","priority":2,"issue_type":"task","labels":["area:auth","config"],"created_at":"2026-11-11T21:12:27+06:00","updated_at":"2026-11-11T21:12:39+06:00"},{"id":"cfc2c88","title":"Signed APK builds but is never published as a release","description":"android-builds.yml runs on a green CI and produces a signed APK for four ABIs, but the guard reports 'android-build: build (build mode is build; artifacts only, no release)' because the repository variable ANDROID_BUILD_MODE is set to build. The APK therefore exists only as a workflow artifact and nothing appears under Releases, so there is no installable candidate and the update catalogue still points at v0.15.0-beta.1.\n\nThis is deliberate configuration, not a defect: publishing would offer an undevice-accepted 0.16.0-beta.1 to existing installs through android-updates. Flipping the variable to publish, or dispatching the workflow with mode=publish, is an owner decision.","acceptance_criteria":"","status":"open","priority":2,"issue_type":"task","labels":["area:release","config"],"created_at":"2026-11-11T21:12:27+06:00","updated_at":"2026-11-11T21:12:39+06:00"}]</script>

<script>
(() => {
  const board = document.getElementById('board');
  try {
    const issues = JSON.parse(document.getElementById('board-data').textContent);
    const controls = Object.fromEntries(['search', 'priority', 'label', 'type', 'closed'].map(id => [id, document.getElementById(id)]));
    const key = 'norfold-progress-board-filters';
    const values = (items) => [...new Set(items.filter(value => value !== undefined && value !== null && value !== '').map(String))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    const labels = issue => Array.isArray(issue.labels) ? issue.labels : [];
    for (const [name, options] of Object.entries({ priority: values(issues.map(i => i.priority)), label: values(issues.flatMap(labels)), type: values(issues.map(i => i.issue_type)) })) {
      for (const value of options) controls[name].add(new Option(name === 'priority' ? `P${value}` : value, value));
    }
    try {
      const saved = JSON.parse(localStorage.getItem(key) || '{}');
      for (const name of ['search', 'priority', 'label', 'type']) if (typeof saved[name] === 'string') controls[name].value = saved[name];
      controls.closed.checked = saved.closed === true;
    } catch { /* Storage can be unavailable for local files. */ }
    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };
    const statuses = (() => {
      // Active work must lead. Alphabetical order put "closed" first, which is
      // the one column a reader opening this board least wants to see first.
      const ORDER = ['open', 'in_progress', 'in-progress', 'blocked', 'deferred', 'closed'];
      const rank = (status) => { const i = ORDER.indexOf(status); return i < 0 ? ORDER.length : i; };
      return values(issues.map(i => i.status)).sort((a, b) => rank(a) - rank(b));
    })();
    const columns = new Map();
    const fragment = document.createDocumentFragment();
    for (const status of statuses) {
      const column = el('details', 'column');
      column.open = true;
      const heading = el('summary');
      heading.append(el('h2', '', status.replaceAll('_', ' ')));
      const count = el('span', 'count', '0');
      heading.append(count);
      const cards = el('div', 'cards');
      column.append(heading, cards);
      columns.set(status, { column, count, cards });
      fragment.append(column);
    }
    board.append(fragment);
    function render() {
      const state = { search: controls.search.value, priority: controls.priority.value, label: controls.label.value, type: controls.type.value, closed: controls.closed.checked };
      try { localStorage.setItem(key, JSON.stringify(state)); } catch { /* Filters still work for this session. */ }
      const query = state.search.trim().toLocaleLowerCase();
      for (const [status, group] of columns) {
        group.column.hidden = status === 'closed' && !state.closed;
        const matches = issues.filter(issue => issue.status === status && (!state.priority || String(issue.priority) === state.priority) && (!state.label || labels(issue).includes(state.label)) && (!state.type || issue.issue_type === state.type) && (!query || [issue.id, issue.title, issue.description, issue.acceptance_criteria, issue.issue_type, ...labels(issue)].some(value => String(value || '').toLocaleLowerCase().includes(query))));
        group.count.textContent = String(matches.length);
        const cards = document.createDocumentFragment();
        for (const issue of matches) {
          const card = el('article');
          const meta = el('div', 'meta');
          meta.append(el('span', 'id', issue.id), el('span', 'priority', issue.priority == null ? 'No priority' : `P${issue.priority}`), el('span', '', issue.issue_type || 'Unspecified type'));
          card.append(meta, el('h3', '', issue.title || 'Untitled'));
          if (labels(issue).length) card.append(el('p', 'labels', labels(issue).join(' · ')));
          const text = String(issue.description || 'No description.');
          const details = el('details', 'description');
          details.append(el('summary', '', text.length > 120 ? `${text.slice(0, 120).trimEnd()}…` : text), el('p', '', text));
          card.append(details);
          cards.append(card);
        }
        if (!matches.length) cards.append(el('p', 'empty', 'No issues match these filters.'));
        group.cards.replaceChildren(cards);
      }
    }
    for (const control of Object.values(controls)) control.addEventListener(control === controls.search ? 'input' : 'change', render);
    render();
  } catch (error) {
    board.textContent = 'Could not display the snapshot. Run node scripts/progress-board.mjs to refresh it.';
    console.error(error);
  }
})();
</script>
