# Norfold — manual backend deploy (migrations + Edge Functions).
#
# Kept separate from both CI and the app release pipeline on purpose: backend
# mutations are explicit, one at a time, with live verification after each.
# Manual dispatch only — never on push, never on a tag.
#
# Required secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF (or the
# SUPABASE_PROJECT_REF variable), SUPABASE_DB_PASSWORD.
#
# Every `functions deploy` passes `--yes`: the runner has no TTY, and without it
# the CLI prints "Confirmation required … Nothing was changed" and exits 1, so a
# dispatched run looked like a deploy failure while production stayed untouched.
# After every run, verify live:
#   anon GET /rest/v1/users?select=*  -> 401
#   anon POST /rest/v1/rpc/is_username_available -> true/false boolean only

name: Backend deploy

on:
  workflow_dispatch:
    inputs:
      push_migrations:
        description: "Push pending supabase/migrations (db push)"
        type: boolean
        default: false
      deploy_device_list:
        description: "Deploy ONLY the accepted Devices LIST migration, with live readback"
        type: boolean
        default: false
      deploy_chat_media_ack:
        description: "Deploy ONLY the accepted Chat media ACK repair, with exact live readback"
        type: boolean
        default: false
      deploy_history_peers:
        description: "Deploy ONLY the accepted Chat history/peer migrations, with exact schema readback"
        type: boolean
        default: false
      deploy_push_dispatch:
        description: "Deploy the push-dispatch Edge Function"
        type: boolean
        default: false
      deploy_telegram_webhook:
        description: "Deploy the Telegram auth webhook Edge Function"
        type: boolean
        default: false
      deploy_reply_comment:
        description: "Deploy the reply-comment Edge Function"
        type: boolean
        default: false
      deploy_cleanup_comment_media:
        description: "Deploy the cleanup-comment-media Edge Function"
        type: boolean
        default: false
      deploy_cleanup_report_media:
        description: "Deploy the cleanup-report-media Edge Function (P11 migrations required)"
        type: boolean
        default: false
      deploy_chat_wake:
        description: "Deploy the chat-wake Edge Function (P11 migrations required)"
        type: boolean
        default: false
      deploy_chat_media:
        description: "Deploy the chat-media gateway Edge Function"
        type: boolean
        default: false
      deploy_device_enroll:
        description: "Deploy the device-enroll verification Edge Function"
        type: boolean
        default: false
      deploy_cleanup_chat_media:
        description: "Deploy the cleanup-chat-media sweeper Edge Function"
        type: boolean
        default: false
      deploy_cleanup_chat_files:
        description: "Deploy the cleanup-chat-files sweeper Edge Function (after 20261115140000 chat file budget)"
        type: boolean
        default: true
      deploy_copy_chat_evidence:
        description: "Deploy the copy-chat-evidence worker Edge Function"
        type: boolean
        default: false
      enable_leaked_password_protection:
        description: "Enable Auth leaked-password protection (requires eligible plan)"
        type: boolean
        default: false
      deploy_trust_maintenance:
        description: "Deploy the appeal expiry and report-evidence maintenance worker (M3 migrations required)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrations + Edge Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Push pending migrations
        if: inputs.push_migrations && !inputs.deploy_device_list && !inputs.deploy_chat_media_ack && !inputs.deploy_history_peers
        run: |
          # CLI v2 defaults `db push` to the local stack even after `link`.
          # Every other deploy path here already selects the remote explicitly;
          # without --remote this step failed closed on 127.0.0.1:54322 while
          # reporting a successful link.
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --remote --skip-vault --dry-run
          supabase db push --remote --skip-vault --yes
      # The database now calls the dispatcher itself, so it needs the dispatcher's
      # credential: this seeds `push_dispatch_secret` into Vault. It is here rather
      # than in the migration because `db push` runs with --skip-vault. The value
      # must equal the push-dispatch function environment (`PUSH_DISPATCH_SECRET`),
      # or every write-time call is rejected with 401. It travels only as an
      # environment variable and a psql variable: never interpolated by the shell,
      # never echoed, and xtrace stays off.
      - name: Seed the push dispatch secret in Vault
        if: inputs.push_migrations && !inputs.deploy_device_list && !inputs.deploy_chat_media_ack && !inputs.deploy_history_peers
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PUSH_DISPATCH_SECRET: ${{ secrets.PUSH_DISPATCH_SECRET }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${PUSH_DISPATCH_SECRET:-}" ]; then
            echo '::error::PUSH_DISPATCH_SECRET is not provisioned; write-time dispatch would be rejected.'
            exit 1
          fi
          if [ -z "${PROJECT_REF:-}" ]; then
            echo '::error::PROJECT_REF is not set; the secret was not seeded.'
            exit 1
          fi
          command -v psql >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          # The runner has no IPv6 route, so the IPv4 Supavisor pooler is used
          # instead of the direct db.<ref> host. Host and port come from the
          # project's own pooler configuration: the hostname carries a pooler
          # index and a region, and both are deployment details that must not be
          # hardcoded here.
          POOLER=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler")
          DB_HOST=$(printf '%s' "$POOLER" | jq -r 'if type == "array" then ([.[] | select(.database_type == "PRIMARY")][0] // .[0]) else . end | .db_host // empty')
          DB_PORT=$(printf '%s' "$POOLER" | jq -r 'if type == "array" then ([.[] | select(.database_type == "PRIMARY")][0] // .[0]) else . end | .db_port // empty')
          if [ -z "$DB_HOST" ] || [ -z "$DB_PORT" ]; then
            echo '::error::Could not read the pooler host; the secret was not seeded.'
            exit 1
          fi
          psql -X -q -v ON_ERROR_STOP=1 -v push_secret="$PUSH_DISPATCH_SECRET" \
            -h "$DB_HOST" -p "$DB_PORT" \
            -U "postgres.${PROJECT_REF}" -d postgres <<'SQL'
          -- One transaction, so the local setting and the write it feeds cannot
          -- land on different pooler backends. The result is discarded: the value
          -- must never be printed.
          begin;
          select set_config('findback.push_dispatch_secret', :'push_secret', true) \g /dev/null
          do $$
          declare
            v_id uuid;
            v_value text := current_setting('findback.push_dispatch_secret', true);
            v_desc constant text := 'x-findback-dispatch-secret presented by the write-time push dispatcher';
          begin
            if coalesce(v_value, '') = '' then
              raise exception 'the push dispatch secret is empty';
            end if;
            if to_regclass('vault.secrets') is null then
              raise exception 'Vault is not available on this database';
            end if;
            select id into v_id from vault.secrets where name = 'push_dispatch_secret' limit 1;
            if v_id is null then
              perform vault.create_secret(v_value, 'push_dispatch_secret', v_desc);
            else
              perform vault.update_secret(v_id, v_value, 'push_dispatch_secret', v_desc);
            end if;
          end $$;
          commit;
          SQL
      - uses: actions/setup-node@v5
        if: inputs.deploy_device_list || inputs.deploy_chat_media_ack || inputs.deploy_history_peers
        with:
          node-version: 24
      - name: Deploy only the accepted Devices LIST repair
        if: inputs.deploy_device_list
        run: |
          set -euo pipefail
          [ '${{ inputs.push_migrations }}' = 'false' ] && [ '${{ inputs.deploy_chat_media_ack }}' = 'false' ] && [ '${{ inputs.deploy_history_peers }}' = 'false' ] || { echo 'Do not combine narrow and general migration deployment'; exit 1; }
          supabase link --project-ref "$PROJECT_REF"
          # Current CLI defaults to local even after linking. Select remote
          # explicitly; vault synchronization is outside this narrow repair.
          supabase db push --remote --skip-vault --dry-run 2>&1 | tee "$RUNNER_TEMP/device-migration-plan.txt"
          node scripts/device-list-deployment.mjs --plan "$RUNNER_TEMP/device-migration-plan.txt"
          supabase db push --remote --skip-vault --yes
          node scripts/device-list-deployment.mjs --verify
      - name: Deploy only the accepted Chat media ACK repair
        if: inputs.deploy_chat_media_ack
        run: |
          set -euo pipefail
          [ '${{ inputs.push_migrations }}' = 'false' ] && [ '${{ inputs.deploy_device_list }}' = 'false' ] && [ '${{ inputs.deploy_history_peers }}' = 'false' ] || { echo 'Do not combine narrow deployments'; exit 1; }
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --remote --skip-vault --dry-run 2>&1 | tee "$RUNNER_TEMP/media-ack-plan.txt"
          node scripts/chat-media-ack-deployment.mjs --plan "$RUNNER_TEMP/media-ack-plan.txt"
          supabase db push --remote --skip-vault --yes
          node scripts/chat-media-ack-deployment.mjs --verify
      - name: Deploy only the accepted history peer repair
        if: inputs.deploy_history_peers
        run: |
          set -euo pipefail
          [ '${{ inputs.push_migrations }}' = 'false' ] && [ '${{ inputs.deploy_device_list }}' = 'false' ] && [ '${{ inputs.deploy_chat_media_ack }}' = 'false' ] || { echo 'Do not combine narrow deployments'; exit 1; }
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --remote --skip-vault --dry-run 2>&1 | tee "$RUNNER_TEMP/history-peer-plan.txt"
          node scripts/history-peer-deployment.mjs --plan "$RUNNER_TEMP/history-peer-plan.txt"
          supabase db push --remote --skip-vault --yes
          node scripts/history-peer-deployment.mjs --verify
      - name: Enable and verify leaked-password protection
        if: inputs.enable_leaked_password_protection
        run: node scripts/enable-leaked-password-protection.mjs
      - name: Deploy push-dispatch
        if: inputs.deploy_push_dispatch
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Server-to-server only: the function enforces its own
          # x-findback-dispatch-secret, so the gateway JWT check is redundant.
          supabase functions deploy push-dispatch --no-verify-jwt --yes
      - name: Deploy telegram-auth-webhook
        if: inputs.deploy_telegram_webhook
        run: |
          set -euo pipefail
          supabase functions deploy telegram-auth-webhook --no-verify-jwt --project-ref "$PROJECT_REF" --yes
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            "https://${PROJECT_REF}.supabase.co/functions/v1/telegram-auth-webhook")
          [ "$STATUS" = '401' ] || { echo "Webhook secret check returned HTTP $STATUS, expected 401"; exit 1; }
      - name: Deploy reply-comment
        if: inputs.deploy_reply_comment
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Server-to-server only: the device presents a single-use reply token,
          # not a Supabase session.
          supabase functions deploy reply-comment --no-verify-jwt --yes
      - name: Deploy cleanup-comment-media
        if: inputs.deploy_cleanup_comment_media
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Internal sweeper: canonical server auth:'secret' validates apikey;
          # gateway JWT verification must be OFF for backend secret API keys.
          # Deploy only after the chain through 20261102220000 is live
          # (private reservations + TTL purge + pending-status RPC).
          supabase functions deploy cleanup-comment-media --no-verify-jwt --yes
      - name: Deploy cleanup-report-media
        if: inputs.deploy_cleanup_report_media
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Internal sweeper only: the function enforces its own service-role /
          # x-cleanup-secret check. Deploy only after
          # 20261102120000_p11_authority_closure (queue + purge RPCs) is live.
          # Do not force-uninstall or vacuum; queued keys stay until storage
          # removal succeeds.
          supabase functions deploy cleanup-report-media --no-verify-jwt --yes
      - name: Deploy chat-wake
        if: inputs.deploy_chat_wake
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # The function verifies the caller's user JWT itself and then asks the
          # database whether that account sent the message; the gateway JWT
          # check would only duplicate that. Deploy only after
          # 20261102120000_p11_authority_closure (message-scoped claim) is live.
          supabase functions deploy chat-wake --no-verify-jwt --yes
      # NOTE: delete-account is intentionally NOT deployed by this workflow.
      # No delete-account pattern exists here or elsewhere in CI; it deploys
      # separately, by hand, after explicit auth review.
      - name: Deploy chat-media
        if: inputs.deploy_chat_media
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # The gateway verifies the caller's Supabase user JWT itself and then
          # authorizes the attachment through the database; the gateway-level
          # JWT check would only duplicate that, and it cannot express the
          # service-owned delivery path. Deploy only after the chat media
          # authorization migrations are live.
          supabase functions deploy chat-media --no-verify-jwt --yes
      - name: Deploy device-enroll
        if: inputs.deploy_device_enroll
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF"
          # The function verifies the caller's user JWT itself; a gateway check
          # would answer before it and drop the browser CORS contract.
          supabase functions deploy device-enroll --no-verify-jwt --yes
          # Live proof: a browser preflight that carries the Sentry tracing pair
          # (the header set that used to block every enrollment POST) must pass.
          ALLOW=$(curl -sS -o /dev/null -D - -X OPTIONS \
            "https://${PROJECT_REF}.supabase.co/functions/v1/device-enroll" \
            -H 'Origin: https://findbackapp.social' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,baggage,sentry-trace' \
            | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-headers"{print tolower($2)}')
          echo "allow-headers: $ALLOW"
          echo "$ALLOW" | grep -q 'baggage' || { echo 'live preflight rejects baggage'; exit 1; }
          echo "$ALLOW" | grep -q 'sentry-trace' || { echo 'live preflight rejects sentry-trace'; exit 1; }
      - name: Deploy cleanup-chat-media
        if: inputs.deploy_cleanup_chat_media
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Internal sweeper only: the canonical wrapper enforces the server
          # secret. No anonymous or user route may sweep private media.
          supabase functions deploy cleanup-chat-media --no-verify-jwt --yes
      - name: Deploy cleanup-chat-files
        if: inputs.deploy_cleanup_chat_files
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Internal sweeper only: the canonical wrapper enforces the server
          # secret. It fails closed (500, nothing deleted) until the service-only
          # findback_chat_file_marker_present RPC from 20261115140000 is live, so
          # deploy it after that migration has been pushed.
          supabase functions deploy cleanup-chat-files --no-verify-jwt --yes
      - name: Deploy copy-chat-evidence
        if: inputs.deploy_copy_chat_evidence
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Internal moderation-evidence worker only: the canonical wrapper
          # enforces the server secret and claims work from the evidence queue.
          supabase functions deploy copy-chat-evidence --no-verify-jwt --yes
      - name: Deploy trust-maintenance
        if: inputs.deploy_trust_maintenance
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Internal secret-auth worker; only after accepted M3 migration rollout.
          supabase functions deploy trust-maintenance --no-verify-jwt --yes
