# Candidate Android builds after successful main CI, plus manual dispatch.
#
# This workflow BUILDS signed candidate APKs and uploads them as Actions
# artifacts. It NEVER creates a GitHub Release, uploads release metadata, edits
# a release or pushes a tag: numbered releases are produced by release.yml from
# a v<app version> tag. Keep this path build-only so the two workflows never
# compete over the same release.
#
# One switch controls what this workflow does: repo variable
# ANDROID_BUILD_MODE = none | build (unset means build).
#   none  - no automatic builds
#   build - build on every successful main CI, upload a 7-day artifact, never
#           create or touch a release
# The legacy value `publish` is still accepted but is treated as `build` with a
# notice: it no longer publishes, because release.yml owns numbered releases.
# A manual run may override the mode for that run alone.

name: Android builds

on:
  # Manual candidate builds: signed Actions artifacts, never a Release.
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (repo variable), none, or build; publish is deprecated and builds an artifact"
        type: choice
        options: [auto, none, build, publish]
        default: auto
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Candidate builds only read the repository: no release or tag is created here.
permissions:
  contents: read

# One candidate build at a time, so a dispatched run and a CI follow-up do not
# duplicate the 45-minute build for the same commit.
concurrency:
  group: android-publish
  cancel-in-progress: false
  # Keep successful pushes waiting rather than replacing the previous pending
  # build. GitHub permits up to 100 pending runs in this queue.
  queue: max

env:
  VITE_PUBLIC_SHARE_ORIGIN: ${{ vars.VITE_PUBLIC_SHARE_ORIGIN }}
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
  VITE_SENTRY_ENVIRONMENT: production
  VITE_SENTRY_DIST: android-release
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
  GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
  GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
  VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}

jobs:
  guard:
    # Releases live in release.yml, so this guard only resolves the operator's
    # mode and refuses to build from a failed or foreign upstream run. It stays
    # cheap so a 45-minute build never starts needlessly, and a green workflow
    # always states which lever produced the outcome.
    name: Decide whether this commit needs a candidate build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.check.outputs.decision }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: check
        env:
          INPUT_MODE: ${{ inputs.mode || 'auto' }}
          REPO_VARIABLE_MODE: ${{ vars.ANDROID_BUILD_MODE }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event || 'push' }}
          SAME_REPO: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$INPUT_MODE" != "auto" ]; then
            MODE="$INPUT_MODE"
          else
            MODE="${REPO_VARIABLE_MODE:-build}"
          fi
          MODE="$MODE" node scripts/decide-android-build.mjs

  apk:
    needs: guard
    if: needs.guard.outputs.decision != 'skip'
    name: Signed candidate APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve canonical version code (release/state.json)
        # versionCode is the monotonic release counter from release/state.json,
        # never a commit count. resolve-release.mjs is the canonical resolver:
        # exit 0 = a decision, 1 = blocking problems, 2 = cannot decide. A
        # produced version_code is the next unreleased counter; when the resolver
        # has no candidate change (nothing releasable, or this version is already
        # tagged) it is empty, so the candidate builds at the monotonic floor,
        # release/state.json's versionCode + 1 — exactly the value build.gradle
        # uses when no override is set. The single value feeds both Gradle and
        # the APK verifier below.
        run: |
          set -euo pipefail
          status=0
          node scripts/release/resolve-release.mjs --github-output "$RUNNER_TEMP/release.txt" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::resolve-release could not produce a decision (exit $status); see the reason printed above."
            exit "$status"
          fi
          VERSION_CODE="$(grep -E '^version_code=' "$RUNNER_TEMP/release.txt" | tail -n1 | cut -d= -f2-)"
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="$(node -p "require('./release/state.json').versionCode + 1")"
            echo "resolve-release reported no candidate version code (no releasable change, or already tagged); building the candidate at the monotonic floor ${VERSION_CODE}."
          fi
          echo "VERSION_CODE_OVERRIDE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "candidate versionCode: ${VERSION_CODE}"

      - name: Refuse to build without the server URL and publishable key
        # Hard rule: an APK that cannot reach the server is a build failure, not
        # a warning. Publishable key only — never a service/secret key.
        run: |
          set -euo pipefail
          [ -n "${VITE_SUPABASE_URL:-}" ] || { echo "VITE_SUPABASE_URL is empty"; exit 1; }
          case "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" in
            "") echo "VITE_SUPABASE_PUBLISHABLE_KEY is empty"; exit 1 ;;
            sb_secret_*|*service_role*) echo "a secret key must never be baked into a client build"; exit 1 ;;
          esac
          echo "server URL and publishable key present"

      - run: npm ci
      - name: Build shared package
        run: npm run build -w @norfold/shared
      - name: Restore Firebase Android client configuration
        run: node scripts/materialize-google-services.mjs
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      - name: Strict installable config and build identity
        run: |
          node scripts/check-release-config.mjs
          SHA=$(git rev-parse HEAD)
          export BUILD_SHA="$SHA"
          echo "BUILD_SHA=$SHA" >> "$GITHUB_ENV"
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          node scripts/check-version-sync.mjs
          echo "VITE_SENTRY_RELEASE=findback-mobile@${VERSION}+${SHA:0:12}" >> "$GITHUB_ENV"
      - name: Fetch pinned USE asset
        run: node scripts/fetch-use-model.mjs
      - name: Build mobile web dist (Capacitor webDir)
        run: npm run build -w @norfold/mobile
        env:
          CI: true
          SENTRY_UPLOAD_SOURCEMAPS: "true"
      - name: Assert client config in the bundle
        run: node scripts/check-mobile-build-config.mjs --assets apps/mobile/dist/assets
      - name: Report GIF and sticker configuration
        run: node scripts/check-klipy-config.mjs
      - name: Upload matching symbols and remove maps before packaging
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]
          npx -y @sentry/cli@3.8.0 sourcemaps upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --release "$VITE_SENTRY_RELEASE" --dist "$VITE_SENTRY_DIST" apps/mobile/dist
          find apps/mobile/dist -name '*.map' -delete
      - name: Capacitor sync
        run: npm run cap:sync -w @norfold/mobile
      - name: Install pinned NDK + CMake (findback_probe native lib)
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Restore release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/findback-release.jks
      - name: Signed assembleRelease (per-ABI APKs)
        # VERSION_CODE_OVERRIDE arrives via $GITHUB_ENV from the resolve step;
        # build.gradle reads it from the environment (System.getenv), never a
        # -P property, so no explicit pass is needed here.
        run: cd apps/mobile/android && ./gradlew --max-workers=2 :app:assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/findback-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Remove keystore material
        if: always()
        run: rm -f "${{ runner.temp }}/findback-release.jks"

      - name: Verify EVERY APK variant (signature pin, identity, ABI, config)
        # The expected versionCode is the same resolver-derived value passed to
        # Gradle above; VERSION_CODE_OVERRIDE is in the environment from the
        # resolve step. --expected-version-code wins over the env fallback.
        run: |
          export EXPECTED_VERSION_NAME="$(node -p "require('./apps/mobile/package.json').version")"
          bash scripts/verify-release-apks.sh \
            --apk-dir apps/mobile/android/app/build/outputs/apk/release \
            --expected-version-code "$VERSION_CODE_OVERRIDE" \
            --facts-out "$RUNNER_TEMP/apk-facts.json"
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          EXPECTED_APP_ID: com.findback.app

      - name: Stage APKs under candidate filenames
        run: |
          set -euo pipefail
          SHA12="${BUILD_SHA:0:12}"
          echo "SHA12=$SHA12" >> "$GITHUB_ENV"
          rm -rf release-stage && mkdir -p release-stage
          for APK in apps/mobile/android/app/build/outputs/apk/release/*.apk; do
            BASE="$(basename "$APK")"
            case "$BASE" in
              app-arm64-v8a-release.apk)   ABI="arm64-v8a" ;;
              app-armeabi-v7a-release.apk) ABI="armeabi-v7a" ;;
              app-x86_64-release.apk)      ABI="x86_64" ;;
              app-universal-release.apk)  ABI="universal" ;;
              *) echo "unexpected release APK: $BASE"; exit 1 ;;
            esac
            cp "$APK" "release-stage/Norfold-${SHA12}-${ABI}.apk"
          done
          ls -l release-stage/

      - name: Preserve the signed build as an artifact
        if: needs.guard.outputs.decision == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: norfold-chat-candidate-${{ github.sha }}
          path: release-stage/Norfold-*.apk
          if-no-files-found: error
          retention-days: 7
