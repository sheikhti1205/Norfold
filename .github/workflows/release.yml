# Norfold — the ONLY publisher of numbered releases.
#
# One run decides, gates, prepares, builds, publishes and finalises at most one
# numbered release:
#
#   decide   resolve-release.mjs reads release/state.json, classifies
#            classificationBase..HEAD and answers "release required?" with the
#            next version and version code. It is the only place the version is
#            computed; every later job reads it from this job's outputs.
#   gate     the full release gate (typecheck, lint, secret scan, audits, mobile
#            tests, Android JVM tests). A failure here stops the run. Runs
#            whenever a candidate version exists, so a dry run verifies
#            something without publication being enabled.
#   prepare  writes the version into both package.json files + the lockfile,
#            records `pendingRelease` in release/state.json and commits/pushes
#            `chore(release): v<version>` to main. No tag is created here. Runs
#            only in publish mode, and only when the resolver asks to publish now.
#   build    builds/signs every APK variant + the AAB from the prepare commit
#            (the triggering commit in a dry run), verifies the signed bytes,
#            writes the catalogue + manifest + checksums and uploads them as
#            workflow artifacts.
#   publish  creates the tag on the prepare commit (only if it does not already
#            exist), then the GitHub release.
#   finalize promotes the pending release in release/state.json and pushes
#            `chore(release): finalise v<version>`.
#
# A dry run (`workflow_dispatch` with `mode: dry-run`) runs exactly decide, gate
# and build: nothing is committed, tagged or released, and it needs neither
# RELEASE_PUBLICATION_ENABLED nor an elapsed batch interval.
#
# Triggers: `workflow_dispatch` (defaults to a dry run) and an hourly schedule.
# There is deliberately NO `push` trigger — not even for tags — because this
# workflow creates and pushes its own tags and its own commits to main. A push
# trigger would let it re-enter on its own release/finalise commits.
#
# Idempotency: a `pendingRelease` in release/state.json is a continuation, not a
# new decision. Re-running after a failure between prepare and publish resumes
# the same version and code, reuses the existing prepare commit, and neither
# creates a second tag nor a second release.
#
# Required repo configuration:
#   Variables: RELEASE_PUBLICATION_ENABLED ("true" is the only value that lets
#              anything publish), RELEASE_BATCH_INTERVAL_HOURS (hours between
#              automatic releases; unset means the resolver's 24h default),
#              VITE_SUPABASE_URL, VITE_SENTRY_DSN (real https DSN — Sentry is
#              MANDATORY in installable builds), SENTRY_ORG, SENTRY_PROJECT,
#              GOOGLE_WEB_CLIENT_ID, VITE_SENTRY_TRACES_SAMPLE_RATE,
#              VITE_MONITORING_SELFTEST, VITE_PUBLIC_SHARE_ORIGIN
#   Secrets:   VITE_SUPABASE_PUBLISHABLE_KEY, VITE_KLIPY_API_KEY,
#              SENTRY_AUTH_TOKEN, GOOGLE_SERVICES_JSON_B64,
#              ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#              ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#              ANDROID_SIGNING_CERT_SHA256 (exact expected SHA-256 fingerprint
#              of the release certificate — pinned on EVERY APK variant plus the
#              AAB; values are never echoed)
#   Environment `release` (protection rules configured in repo settings) gates
#   the signed build, so nothing publishes without it succeeding.

name: Release
env:
  VITE_PUBLIC_SHARE_ORIGIN: ${{ vars.VITE_PUBLIC_SHARE_ORIGIN }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run builds and verifies without committing, tagging or publishing"
        type: choice
        options: [dry-run, publish]
        default: dry-run
      urgent:
        description: "publish even if the batch interval has not elapsed"
        type: boolean
        default: false
  # Hourly. The resolver decides whether the batch interval has elapsed; the
  # schedule itself never publishes anything the resolver did not ask for.
  schedule:
    - cron: "0 * * * *"

# Tag creation, the release, and the release/finalise commits all need write.
permissions:
  contents: write

# One publication at a time. A queued run must not start while another is
# building, and a cancelled build must never leave a prepared release behind.
concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  decide:
    name: Decide the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_required: ${{ steps.resolve.outputs.release_required }}
      version: ${{ steps.resolve.outputs.version }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      impact: ${{ steps.resolve.outputs.impact }}
      reason: ${{ steps.resolve.outputs.reason }}
      classification_base: ${{ steps.resolve.outputs.classification_base }}
      publication_enabled: ${{ steps.resolve.outputs.publication_enabled }}
      breakdown: ${{ steps.resolve.outputs.breakdown }}
    env:
      RELEASE_PUBLICATION_ENABLED: ${{ vars.RELEASE_PUBLICATION_ENABLED }}
      RELEASE_BATCH_INTERVAL_HOURS: ${{ vars.RELEASE_BATCH_INTERVAL_HOURS }}
      RELEASE_URGENT: ${{ inputs.urgent || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + every tag: the resolver classifies a commit range and
          # checks whether the candidate tag already exists.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Resolve the release decision
        id: resolve
        run: |
          set -uo pipefail
          # An unset repository variable reaches the runner as an EMPTY string,
          # and the resolver rejects "" as garbage. Unset it so the documented
          # 24h default applies instead.
          if [ -z "${RELEASE_BATCH_INTERVAL_HOURS:-}" ]; then unset RELEASE_BATCH_INTERVAL_HOURS; fi

          status=0
          node scripts/release/resolve-release.mjs --github-output "$GITHUB_OUTPUT" \
            > "$RUNNER_TEMP/decision.json" 2> "$RUNNER_TEMP/decision.log" || status=$?

          echo "--- resolve-release stderr ---"
          cat "$RUNNER_TEMP/decision.log" || true
          echo "--- resolve-release decision ---"
          cat "$RUNNER_TEMP/decision.json" || true

          # 1 = blocking problem, 2 = cannot decide. Both are hard failures.
          if [ "$status" -ne 0 ]; then
            echo "::error::resolve-release exited $status (1 = blocking problem, 2 = cannot decide)"
            exit "$status"
          fi

          # The resolver writes scalars to GITHUB_OUTPUT. `impact_breakdown` is an
          # object and `escalated`/`unparseable` are arrays, so those three are
          # rendered here as scalars for the step summary.
          META_STATUS=0
          node -e '
            const fs = require("node:fs");
            const decision = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const breakdown = decision.impact_breakdown || {};
            const breakdownLine = ["none", "patch", "minor", "major"]
              .map((key) => `${key}=${breakdown[key] ?? 0}`)
              .join(" ");
            const shortShas = (items) => {
              const list = (items || []).map((sha) => String(sha).slice(0, 12));
              return list.length === 0 ? "-" : list.join(" ");
            };
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `breakdown=${breakdownLine}\nescalated=${shortShas(decision.escalated)}\nunparseable=${shortShas(decision.unparseable)}\n`,
            );
          ' "$RUNNER_TEMP/decision.json" || META_STATUS=$?
          if [ "$META_STATUS" -ne 0 ]; then
            echo "::error::could not render the decision summary fields from decision.json (exit ${META_STATUS})"
            exit "$META_STATUS"
          fi
      - name: Step summary
        if: always()
        # Every decision field, plus one plain sentence. "Would publish X" and
        # "would publish nothing, because Y" must be distinguishable without
        # reading logs, and a run with no candidate version is a legitimate
        # answer that still succeeds.
        run: |
          set -uo pipefail
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'schedule' }}"
          DECISION="${{ steps.resolve.outcome }}"
          VERSION="${{ steps.resolve.outputs.version }}"
          CODE="${{ steps.resolve.outputs.version_code }}"
          REQUIRED="${{ steps.resolve.outputs.release_required }}"
          PUBLICATION="${{ steps.resolve.outputs.publication_enabled }}"
          REASON="${{ steps.resolve.outputs.reason }}"

          {
            echo "### Release decision"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Mode | \`${MODE}\` |"
            echo "| Version | \`${{ steps.resolve.outputs.version || '-' }}\` |"
            echo "| Version code | \`${{ steps.resolve.outputs.version_code || '-' }}\` |"
            echo "| Impact | \`${{ steps.resolve.outputs.impact || '-' }}\` |"
            echo "| Impact breakdown | \`${{ steps.resolve.outputs.breakdown || '-' }}\` |"
            echo "| Escalated commits | \`${{ steps.resolve.outputs.escalated || 'none' }}\` |"
            echo "| Unparseable commits | \`${{ steps.resolve.outputs.unparseable || 'none' }}\` |"
            echo "| Commits classified | \`${{ steps.resolve.outputs.commits_total || '0' }}\` |"
            echo "| Reason | \`${REASON:-'-'}\` |"
            echo "| Publication enabled | \`${PUBLICATION:-false}\` |"
            echo "| Batch interval (hours) | \`${{ steps.resolve.outputs.batch_interval_hours || 'unset' }}\` |"
            echo "| Release required now | \`${REQUIRED:-false}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # The single sentence a reader needs: whether this run will publish, and
          # if not, exactly where it stopped. A publish-mode run the resolver did
          # not arm stops before `gate` and `build`, so the sentence must not
          # promise a build for it.
          if [ "$DECISION" != "success" ]; then
            OUTCOME="Nothing was published: the resolver produced no decision (see the failed decide step)."
          elif [ -z "$VERSION" ]; then
            OUTCOME="Nothing was published and nothing will be built: there is no candidate version (${REASON:-no releasable changes})."
          elif [ "$MODE" = "dry-run" ]; then
            OUTCOME="Nothing was published — dry-run mode. v${VERSION} (version code ${CODE}) is rehearsed: the gate, the signed build and the cross-artifact check run, but nothing is committed, tagged or released."
          elif [ "$REQUIRED" = "true" ]; then
            OUTCOME="This run publishes v${VERSION} (version code ${CODE}): prepare, signed build, tag and GitHub release."
          elif [ "$PUBLICATION" = "true" ]; then
            OUTCOME="Nothing was published and the run stopped before the gate and the signed build: the batch interval has not elapsed. v${VERSION} (version code ${CODE}) stays a candidate for a later hourly run."
          else
            OUTCOME="Nothing was published and the run stopped before the gate and the signed build: publication is disabled. v${VERSION} (version code ${CODE}) stays a candidate until RELEASE_PUBLICATION_ENABLED is true."
          fi
          {
            echo "**${OUTCOME}**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stage the shared release-preparation script
        if: ${{ success() && steps.resolve.outputs.version != '' }}
        # `prepare` (publish) and the dry-run rehearsal in `build` must perform the
        # same two writes, so the script both of them execute is rendered once,
        # here, and handed over as an artifact. Two writes only:
        #   1. sync-version.mjs — root + mobile package.json and both lock entries;
        #   2. the pendingRelease record through state.mjs's validated writer.
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/write-pending-release.mjs" <<'NODE'
          import { execFileSync } from "node:child_process";
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";

          const [version, code] = process.argv.slice(2);
          if (!version || !code) {
            console.error("usage: write-pending-release.mjs <version> <versionCode>");
            process.exit(2);
          }
          const repo = process.cwd();

          // 1. The four version locations, through the canonical writer.
          execFileSync(process.execPath, ["scripts/release/sync-version.mjs", version], {
            cwd: repo,
            stdio: "inherit",
          });

          // 2. The pending record. Nothing is published yet, so it is exactly
          //    { tag, version, versionCode }: no commit SHA, no timestamp.
          //    version, versionCode, classificationBase and lastRelease keep
          //    their values; the writer validates before it writes.
          const { loadState, writeState } = await import(
            pathToFileURL(resolve(repo, "scripts/release/state.mjs")).href
          );
          writeState(repo, {
            ...loadState(repo),
            pendingRelease: { tag: `v${version}`, version, versionCode: Number(code) },
          });
          console.log(`pendingRelease v${version} code ${code} recorded`);
          NODE
          node --check "$RUNNER_TEMP/write-pending-release.mjs"
      - name: Upload the release-preparation script
        if: ${{ success() && steps.resolve.outputs.version != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-prepare-${{ github.run_id }}
          path: ${{ runner.temp }}/write-pending-release.mjs
          # Consumed by `prepare` and `build` in this same run only.
          retention-days: 3
          if-no-files-found: error

  gate:
    name: Full release gate
    needs: decide
    # A build is consumed only when this run can use it: it will publish
    # (`release_required`), or it is a dry run for an existing candidate. A
    # publish-mode run the resolver did not arm (publication disabled, or the
    # batch interval has not elapsed) stops here instead of paying for the gate
    # and a 45-minute signed build it could never publish.
    if: ${{ !cancelled() && needs.decide.result == 'success' && needs.decide.outputs.version != '' && (needs.decide.outputs.release_required == 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      # KLIPY (X7): the gate job bakes the same mobile web dist (Capacitor webDir)
      # as the signed build, so it carries the same adapter flag. Blank -> disabled
      # and the GIF control is hidden. Secret-only; never a literal.
      VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Version sync + clean tree
        # Between prepare and finalise the packages carry the released version
        # while release/state.json still holds the previous one — that gap is the
        # design, so a resumed run must assert the four written places instead of
        # the state's `version`. Read-only; the release commit is written later by
        # `prepare`, never here.
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is not clean"; git status --porcelain; exit 1
          fi
          PENDING_TAG=$(node -e '
            const state = require("./release/state.json");
            process.stdout.write(state.pendingRelease ? state.pendingRelease.tag : "");
          ')
          if [ -n "$PENDING_TAG" ]; then
            echo "in-flight release ${PENDING_TAG}: asserting the packages/lock against ${VERSION}"
            node scripts/release/sync-version.mjs --verify "$VERSION"
          else
            node scripts/check-version-sync.mjs --ref "${{ github.ref }}"
          fi
      - name: Commit-message convention over the release range
        # Exactly the range the resolver classified and the release body groups.
        env:
          CLASSIFICATION_BASE: ${{ needs.decide.outputs.classification_base }}
        run: |
          if [ -z "$CLASSIFICATION_BASE" ]; then echo "no classification base in release/state.json"; exit 1; fi
          node scripts/check-commit-messages.mjs --range "${CLASSIFICATION_BASE}..HEAD"
      - uses: actions/setup-node@v5
        with:
          # Full messaging tests use native Web Locks (added in Node 24.5).
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Build shared package (client schemas and contracts)
        run: npm run build -w @norfold/shared
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Secret scan
        run: npm run scan:secrets
      - name: Dependency security baseline (deterministic CVE tripwire)
        run: node scripts/check-security-baseline.mjs
      - name: Dependency audit (0 high / 0 critical)
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Keyless map provider gate (no Google Maps/Places, MapLibre pin intact)
        run: node scripts/check-map-provider.mjs
      - name: Mobile tests
        run: npm test -w @norfold/mobile
      - name: Release-infra script tests (signing, ABI, manifest, publish type)
        # Same suites CI gates; enforced here too so a release cannot sign with a
        # verifier that has drifted from the ABI/signing contract.
        run: node --test scripts/verify-release-apks.test.mjs scripts/generate-release-manifest.test.mjs scripts/derive-publish-type.test.mjs scripts/check-map-provider.test.mjs scripts/legacy-api-retirement.test.mjs
      - name: Fetch pinned USE asset
        run: node scripts/fetch-use-model.mjs
      - name: Restore Firebase Android client configuration
        run: node scripts/materialize-google-services.mjs
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      - name: Strict installable-build config preflight
        run: node scripts/check-mobile-build-config.mjs --preflight && node scripts/check-sentry-config.mjs
      - name: Build mobile web dist (Capacitor webDir)
        run: npm run build -w @norfold/mobile
        env:
          CI: true
      - name: Assert client config in gate bundle
        run: node scripts/check-mobile-build-config.mjs --assets apps/mobile/dist/assets && node scripts/check-klipy-config.mjs --assets apps/mobile/dist/assets
      - name: Capacitor sync
        run: npm run cap:sync -w @norfold/mobile
      - name: Install pinned NDK + CMake (findback_probe native lib)
        # The native VLM/probe build pins NDK 29.0.13113456 + CMake 3.31.6
        # (variables.gradle). A clean runner has no NDK and no accepted
        # licenses, so Gradle's auto-install fails closed without this. Keep
        # byte-identical to ci.yml / local-intelligence-native.yml.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Android JVM tests + debug APK
        run: cd apps/mobile/android && ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Assert client config in gate APK
        run: node scripts/check-mobile-build-config.mjs --apk apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk && node scripts/check-klipy-config.mjs --apk apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  prepare:
    name: Prepare the release commit
    needs: [decide, gate]
    if: ${{ needs.decide.outputs.release_required == 'true' && needs.gate.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'publish') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_sha: ${{ steps.commit.outputs.release_sha }}
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      CODE: ${{ needs.decide.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # Write credentials: this job pushes the release commit.
          persist-credentials: true
          token: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download the shared release-preparation script
        uses: actions/download-artifact@v8
        with:
          name: release-prepare-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Write the version and pendingRelease, commit and push
        id: commit
        run: |
          set -euo pipefail
          BASE_SHA=$(git rev-parse HEAD)

          # A `pendingRelease` for this exact version/code means an earlier run
          # already prepared (and pushed) the release commit. Resume it: creating
          # a second commit would move the release version's commit around.
          PENDING=$(node -e '
            const state = require("./release/state.json");
            const pending = state.pendingRelease;
            process.stdout.write(pending ? `${pending.tag}|${pending.version}|${pending.versionCode}` : "");
          ')

          if [ "$PENDING" = "v${VERSION}|${VERSION}|${CODE}" ]; then
            echo "resuming the pending release recorded in release/state.json"
            node scripts/release/sync-version.mjs --verify "$VERSION"
            if [ -n "$(git status --porcelain)" ]; then
              echo "::error::pendingRelease is recorded but the checkout is not clean"
              git status --porcelain
              exit 1
            fi
            RELEASE_SHA=$(git rev-parse HEAD)
          else
            # The same script the dry-run rehearsal in `build` runs, so the two
            # paths cannot drift: sync-version.mjs, then the pendingRelease record
            # through state.mjs's validated writer. Nothing is published yet, so
            # the record is exactly { tag, version, versionCode } — no commit SHA,
            # no timestamp — and it is written BEFORE the commit, so the commit
            # already contains it and no follow-up rewrite is needed.
            node "$RUNNER_TEMP/write-pending-release.mjs" "$VERSION" "$CODE"

            git add package.json apps/mobile/package.json package-lock.json release/state.json
            git commit -m "chore(release): v${VERSION}"
            RELEASE_SHA=$(git rev-parse HEAD)
          fi

          push_once() { git push origin HEAD:main; }

          if ! push_once; then
            echo "push to main was rejected; checking whether main moved"
            git fetch origin main
            NEW_MAIN=$(git rev-parse origin/main)
            if [ "$NEW_MAIN" = "$BASE_SHA" ]; then
              echo "::error::push failed although origin/main did not move"
              exit 1
            fi

            # Re-run the resolver exactly once against the moved main. It must
            # still want this same version and code, or the release is aborted.
            rm -rf "$RUNNER_TEMP/recheck"
            git worktree add --detach "$RUNNER_TEMP/recheck" "$NEW_MAIN" >/dev/null
            status=0
            ( cd "$RUNNER_TEMP/recheck" && node scripts/release/resolve-release.mjs --github-output "$RUNNER_TEMP/recheck.out" ) \
              > "$RUNNER_TEMP/recheck.json" 2> "$RUNNER_TEMP/recheck.log" || status=$?
            cat "$RUNNER_TEMP/recheck.log" || true
            git worktree remove --force "$RUNNER_TEMP/recheck" || true

            if [ "$status" -ne 0 ]; then
              echo "::error::resolve-release could not decide on the moved main (exit $status)"
              exit 1
            fi

            NEW_DECISION=$(node -e '
              const fs = require("node:fs");
              const map = Object.fromEntries(
                fs.readFileSync(process.argv[1], "utf8")
                  .split("\n")
                  .filter(Boolean)
                  .map((line) => [line.slice(0, line.indexOf("=")), line.slice(line.indexOf("=") + 1)]),
              );
              process.stdout.write(`${map.release_required}|${map.version}|${map.version_code}`);
            ' "$RUNNER_TEMP/recheck.out")

            if [ "$NEW_DECISION" != "true|${VERSION}|${CODE}" ]; then
              echo "::error::main moved and the release decision changed (was v${VERSION}/${CODE}, now ${NEW_DECISION}); nothing was pushed and no force was attempted — re-run the workflow"
              exit 1
            fi

            # Same decision: replay the single release commit on the new base.
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::the release commit does not rebase onto the moved main; nothing was pushed — re-run the workflow"
              exit 1
            fi
            node scripts/release/sync-version.mjs --verify "$VERSION"
            RELEASE_SHA=$(git rev-parse HEAD)
            if ! push_once; then
              echo "::error::push to main was rejected again after one rebase; no force-push attempted"
              exit 1
            fi
          fi

          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "prepared v${VERSION} (code ${CODE}) at ${RELEASE_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Step summary
        if: always()
        run: |
          {
            echo "### Prepared release"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Version code | \`${CODE}\` |"
            echo "| Release commit | \`${{ steps.commit.outputs.release_sha }}\` |"
            echo "| Tag | \`not created here\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Signed APKs + AAB (+ catalogue, manifest)
    needs: [decide, gate, prepare]
    # Same condition as `gate`: a build runs only when this run will publish it,
    # or when it is a dry run of an existing candidate. `prepare` is skipped in
    # dry runs and never runs when the resolver has not armed publication, so a
    # success and a skip both mean "go".
    if: ${{ !cancelled() && needs.decide.outputs.version != '' && (needs.decide.outputs.release_required == 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'publish')) && needs.gate.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      CODE: ${{ needs.decide.outputs.version_code }}
      # build.gradle reads this from the ENVIRONMENT (System.getenv), never a
      # -P property, and refuses any value below release/state.json's floor.
      VERSION_CODE_OVERRIDE: ${{ needs.decide.outputs.version_code }}
      RELEASE_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run') && 'dry-run' || 'publish' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # KLIPY (X7): releases build the mobile web dist (Capacitor webDir) that is
      # packed into the APK, so bake the adapter flag here too. Blank -> disabled
      # and the GIF control is hidden. Secret-only; never a literal in repo files.
      VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
      # Sentry is MANDATORY in signed installable builds (S1). VITE_SENTRY_DSN and the
      # org/project identifiers come from repo Actions VARIABLES (never hardcoded);
      # SENTRY_AUTH_TOKEN stays a CI secret for the sourcemap upload (S3) and must
      # never appear in repo files. The strict release preflight
      # (scripts/check-release-config.mjs) fails closed without a real DSN.
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: production
      # Variable-driven (default resolved + validated in the Resolve step below;
      # empty var falls back to 0.1, garbage fails closed). Never hardcode here.
      VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
      VITE_SENTRY_DIST: android-release
      VITE_MONITORING_SELFTEST: ${{ vars.VITE_MONITORING_SELFTEST }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      # Web/server Google OAuth client ID -> BuildConfig.GOOGLE_WEB_CLIENT_ID.
      # Public identifier (NOT the client secret). Empty fails the hard
      # preflight below before signing; the packaged BuildConfig assert below
      # proves the non-empty value reached the APK.
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The prepare commit once `prepare` ran; otherwise (a dry run, or a run
          # the resolver did not arm, where prepare is skipped) the triggering
          # main commit. Version and code always come from `needs.decide.outputs`.
          ref: ${{ needs.prepare.outputs.release_sha || github.sha }}
          fetch-depth: 0
      - name: Download the shared release-preparation script
        if: ${{ needs.prepare.result == 'skipped' }}
        uses: actions/download-artifact@v8
        with:
          name: release-prepare-${{ github.run_id }}
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Rehearse prepare in the workspace (never committed)
        if: ${{ needs.prepare.result == 'skipped' }}
        # No release commit exists in this run, so the four version locations and
        # the pendingRelease record are written here instead — in the disposable
        # runner workspace, by the exact script `prepare` runs. Build, verifier and
        # summary therefore see the publish path's content and flags. Nothing is
        # staged, committed, tagged or pushed; the runner is thrown away.
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/write-pending-release.mjs" "$VERSION" "$CODE"
          node scripts/release/sync-version.mjs --verify "$VERSION"
          git status --porcelain
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # SYNC-8: Google Web OAuth client ID is a HARD preflight failure (not a
      # warn). An empty or placeholder value stops the signed build before any
      # signing: shipping without the provider would silently drop Google
      # sign-in for every user. Public identifier only — shapes in logs.
      - name: Hard preflight — Google Web OAuth client ID (fail closed)
        run: |
          ID="${GOOGLE_WEB_CLIENT_ID:-}"
          case "$ID" in
            ""|-|x*|*placeholder*|*changeme*|*example*|test|dummy|null|undefined)
              echo "GOOGLE_WEB_CLIENT_ID is missing or a placeholder — refusing to sign (owner action: set the repo Actions variable)"; exit 1 ;;
          esac
          case "$ID" in
            *.apps.googleusercontent.com) echo "Google Web OAuth client ID present (suffix .apps.googleusercontent.com)" ;;
            *) echo "GOOGLE_WEB_CLIENT_ID does not look like a Google OAuth client ID (want *.apps.googleusercontent.com) — refusing to sign"; exit 1 ;;
          esac
      - name: Strict release config preflight
        run: node scripts/check-release-config.mjs
      - name: Restore Firebase Android client configuration
        run: node scripts/materialize-google-services.mjs
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      - name: Build shared package
        run: npm run build -w @norfold/shared
      - name: Fetch pinned USE asset
        run: node scripts/fetch-use-model.mjs
      - name: Compute Sentry release identity (S3)
        run: |
          VERSION_FROM_PACKAGE=$(node -p "require('./apps/mobile/package.json').version")
          SHA=$(git rev-parse --short=12 HEAD)
          SENTRY_RELEASE="findback-mobile@${VERSION_FROM_PACKAGE}+${SHA}"
          # GITHUB_ENV applies to LATER steps only; export for the shape check
          # in THIS shell, then publish for the build + upload steps below.
          export SENTRY_RELEASE
          echo "SENTRY_RELEASE=${SENTRY_RELEASE}" >> "$GITHUB_ENV"
          # VITE_* values in GITHUB_ENV are embedded by the Vite build below, so
          # the SDK `release` (via resolveSentryRelease, see
          # apps/mobile/src/services/monitoring/release.ts) is derived from the
          # exact same string passed to the sourcemap upload.
          echo "VITE_SENTRY_RELEASE=${SENTRY_RELEASE}" >> "$GITHUB_ENV"
          node -e 'const r=process.env.SENTRY_RELEASE; if(!/^findback-mobile@\d+\.\d+\.\d+[-+0-9A-Za-z.]*\+[0-9a-f]{12}$/i.test(r)){console.error(`bad release identity: ${r}`);process.exit(1)} console.log(`release identity OK: ${r}`)'
      # SYNC-6: canonicalize the variable-driven trace rate (empty -> 0.1) and
      # fail closed on garbage (non-numeric or outside 0..1). Re-export covers
      # an empty repo variable (job env would otherwise bake an empty string).
      - name: Resolve Sentry traces sample rate (variable, default 0.1, fail closed)
        run: |
          RATE="${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.1}"
          export SENTRY_RATE="$RATE"
          node -e 'const r=Number(process.env.SENTRY_RATE); if(!Number.isFinite(r)||r<0||r>1){console.error(`bad traces sample rate: ${process.env.SENTRY_RATE} (want number in 0..1)`);process.exit(1)} console.log(`traces sample rate OK: ${r}`)'
          echo "VITE_SENTRY_TRACES_SAMPLE_RATE=${RATE}" >> "$GITHUB_ENV"
      - name: Build mobile web dist (Capacitor webDir)
        run: npm run build -w @norfold/mobile
        env:
          CI: true
          # S3 companion: opt in to hidden-sourcemap emission for this build ONLY.
          # Local builds omit it and emit no .map files at all.
          SENTRY_UPLOAD_SOURCEMAPS: "true"
      - name: Assert Supabase and Sentry in release bundle
        run: node scripts/check-mobile-build-config.mjs --assets apps/mobile/dist/assets && node scripts/check-klipy-config.mjs --assets apps/mobile/dist/assets
      - name: Assert baked client config (no placeholders, no secrets)
        run: |
          # Search every emitted chunk, never just index-*.js: the entry is a
          # small loader, so a single-file grep silently misses baked config.
          ASSETS=apps/mobile/dist/assets
          # The publishable key must appear baked into the bundle…
          grep -rqF -- 'sb_publishable_' "$ASSETS" || { echo "publishable key missing from bundle"; exit 1; }
          # …and the "-" placeholder from run 35531815290 must never recur.
          if grep -rqE 'supabase\.co[^"]*","-' "$ASSETS"; then echo "placeholder key baked into bundle"; exit 1; fi
          # Sentry is MANDATORY in installable builds: assert the real DSN host
          # (and the baked release identity) actually landed in the shipped bundle,
          # so a green build can never ship unmonitored. Shapes only, never the key.
          DSN_HOST=$(node -e "import('./scripts/check-sentry-config.mjs').then(m=>{const r=m.checkEffectiveSentryDsn({mode:'production'});if(!r.ok){console.error('DSN '+r.reason);process.exit(1)}process.stdout.write(r.host)})")
          grep -rqF -- "$DSN_HOST" "$ASSETS" || { echo "Sentry DSN host missing from built bundle"; exit 1; }
          grep -rqF -- "$SENTRY_RELEASE" "$ASSETS" || { echo "Sentry release identity missing from built bundle"; exit 1; }
          # Only counts/shapes are echoed — never key material.
          echo "bundle config assertion passed (assets dir; sentry host $DSN_HOST; release $SENTRY_RELEASE)"
      - name: Upload sourcemaps to Sentry (S3)
        env:
          # Secrets-only auth: the token is held in repo Settings → Secrets
          # and variables → Actions → Secrets, never in repo files, never VITE_*.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SENTRY_AUTH_TOKEN:-}" ] || { echo "SENTRY_AUTH_TOKEN secret is empty — add it in repo Settings → Secrets and variables → Actions → Secrets (owner action)"; exit 1; }
          [ -n "${SENTRY_ORG:-}" ] || { echo "SENTRY_ORG variable is empty — add it in repo Settings → Variables"; exit 1; }
          [ -n "${SENTRY_PROJECT:-}" ] || { echo "SENTRY_PROJECT variable is empty — add it in repo Settings → Variables"; exit 1; }
          [ -n "${SENTRY_RELEASE:-}" ] || { echo "SENTRY_RELEASE was not computed — the Compute step above must run first"; exit 1; }
          MAPS=$(find apps/mobile/dist -name '*.map' | wc -l)
          [ "$MAPS" -gt 0 ] || { echo "no .map files in apps/mobile/dist — the build must run with SENTRY_UPLOAD_SOURCEMAPS=true"; exit 1; }
          # Any upload failure fails this job visibly: a release MUST NOT ship
          # with an SDK release that Sentry cannot symbolicate.
          echo "uploading $MAPS sourcemap(s) for release ${SENTRY_RELEASE} (org/project from job env)"
          # M5: EXACT pin, not a floating major. A `project:releases` token is in this
          # step's environment, so the code npx fetches must not be able to change
          # between two runs of the same commit. Bump deliberately.
          # dist android-release pins release crashes apart from CI (android-debug)
          # and web (web-production) symbols for the same release string.
          npx -y @sentry/cli@3.8.0 sourcemaps upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --release "$SENTRY_RELEASE" --dist android-release apps/mobile/dist
      - name: Strip sourcemaps from distributed assets (S3)
        run: |
          find apps/mobile/dist -name '*.map' -delete
          REMAINING=$(find apps/mobile/dist -name '*.map' | wc -l)
          [ "$REMAINING" -eq 0 ] || { echo "$REMAINING .map file(s) remain after strip — refusing to package"; exit 1; }
          if grep -rIl 'sourceMappingURL' apps/mobile/dist/assets/ 2>/dev/null | grep -q .; then
            echo "sourceMappingURL reference remains in shipped bundle — refusing to package"; exit 1;
          fi
          echo "sourcemap strip verified: no .map files, no sourceMappingURL references in dist"
      - name: Capacitor sync
        run: npm run cap:sync -w @norfold/mobile
      - name: Install pinned NDK + CMake (findback_probe native lib)
        # Same pinned toolchain as the gate/CI: the signed build links the
        # native probe/VLM libraries, so a clean runner must have NDK
        # 29.0.13113456 + CMake 3.31.6 with accepted licenses.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Restore release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/findback-release.jks
      - name: Signed assembleRelease + bundleRelease (per-ABI + universal APKs, AAB)
        # VERSION_CODE_OVERRIDE arrives from the job environment (resolver output),
        # which is where build.gradle reads it: System.getenv, never a -P property.
        run: cd apps/mobile/android && ./gradlew :app:assembleRelease :app:bundleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/findback-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Remove keystore material
        if: always()
        run: rm -f "${{ runner.temp }}/findback-release.jks"
      - name: Verify EVERY APK variant (signature pin, identity, ABI, secrets, config)
        # Any failure here blocks the release. Fingerprint values are never
        # echoed — the script prints match/mismatch only. The expected version
        # code is the resolver's `version_code`, the same value Gradle stamped;
        # it is never derived from git history.
        run: |
          export EXPECTED_VERSION_NAME="$(node -p "require('./apps/mobile/package.json').version")"
          bash scripts/verify-release-apks.sh \
            --apk-dir apps/mobile/android/app/build/outputs/apk/release \
            --aab apps/mobile/android/app/build/outputs/bundle/release/app-release.aab \
            --expected-version-code "$CODE" \
            --facts-out "$RUNNER_TEMP/apk-facts.json"
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          EXPECTED_APP_ID: com.findback.app
      - name: Record artifact sizes (R8 still OFF)
        # Size-measurement hook only: minifyEnabled/shrinkResources stay false
        # (enabling R8 is a separate future change with its own before/after
        # comparison). Sizes land in release-manifest.json `bytes` fields.
        run: |
          ls -l apps/mobile/android/app/build/outputs/apk/release/*.apk \
                apps/mobile/android/app/build/outputs/bundle/release/*.aab
          du -b apps/mobile/android/app/build/outputs/apk/release/*.apk \
                apps/mobile/android/app/build/outputs/bundle/release/*.aab
      - name: Stage release files (friendly names, flat dir)
        # Gradle split names (app-<abi>-release.apk, app-universal-release.apk)
        # become Norfold-<TAG>-<abi|universal>.apk so the Release page and the
        # manifest agree. Tagged with the release version in publish mode and
        # with the dry-run marker otherwise, because a dry run must never look
        # like the published asset set. Unexpected APK names fail closed here.
        run: |
          set -euo pipefail
          OUT=apps/mobile/android/app/build/outputs
          if [ "$RELEASE_MODE" = "dry-run" ]; then TAG="dry-run-${GITHUB_SHA:0:12}"; else TAG="v${VERSION}"; fi
          echo "ART_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          rm -rf release-stage && mkdir -p release-stage
          for APK in "$OUT"/apk/release/*.apk; do
            BASE="$(basename "$APK")"
            case "$BASE" in
              app-arm64-v8a-release.apk)     DEST="Norfold-${TAG}-arm64-v8a.apk" ;;
              app-armeabi-v7a-release.apk)   DEST="Norfold-${TAG}-armeabi-v7a.apk" ;;
              app-x86_64-release.apk)        DEST="Norfold-${TAG}-x86_64.apk" ;;
              app-universal-release.apk)     DEST="Norfold-${TAG}-universal.apk" ;;
              *) echo "unexpected release APK name: $BASE" >&2; exit 1 ;;
            esac
            cp "$APK" "release-stage/$DEST"
          done
          cp "$OUT/bundle/release/app-release.aab" "release-stage/Norfold-${TAG}.aab"
          ls -l release-stage/
      # SYNC-8 companion: prove the hard-preflighted GOOGLE_WEB_CLIENT_ID reached
      # the packaged APK (BuildConfig.GOOGLE_WEB_CLIENT_ID non-empty). Fails
      # closed when the staged APKs do not embed the exact configured value.
      # Public identifier only — the value itself is never echoed.
      - name: Assert packaged Google Web OAuth client ID non-empty
        run: |
          set -euo pipefail
          [ -n "${GOOGLE_WEB_CLIENT_ID:-}" ] || { echo "GOOGLE_WEB_CLIENT_ID empty at assert time — hard preflight above must run first"; exit 1; }
          MATCHED=0
          for APK in release-stage/*.apk; do
            TMPDIR_APK=$(mktemp -d)
            unzip -q "$APK" 'classes*.dex' -d "$TMPDIR_APK"
            if strings "$TMPDIR_APK"/classes*.dex | grep -qF "$GOOGLE_WEB_CLIENT_ID"; then
              echo "BuildConfig client ID present in $(basename "$APK")"
              MATCHED=$((MATCHED+1))
            else
              echo "BuildConfig GOOGLE_WEB_CLIENT_ID missing from $(basename "$APK") — refusing to publish"; exit 1
            fi
            rm -rf "$TMPDIR_APK"
          done
          [ "$MATCHED" -gt 0 ] || { echo "no APKs checked for BuildConfig client ID"; exit 1; }
      - name: Android update catalogue from the verified APK facts
        # The catalogue is what the app reads at launch; every fact in it comes
        # from verify-release-apks.sh's rows, never from a filename.
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./apps/mobile/package.json').version")
          CHANNEL=$(node -p "require('./release/state.json').channel")
          node scripts/write-android-catalogue.mjs \
            --facts "$RUNNER_TEMP/apk-facts.json" \
            --apk-dir release-stage \
            --repo "${{ github.repository }}" \
            --tag "v${PKG_VERSION}" \
            --release-id "$ART_TAG" \
            --version-name "$PKG_VERSION" \
            --version-code "$CODE" \
            --git-sha "$(git rev-parse HEAD)" \
            --published-at "$RELEASE_TIMESTAMP" \
            --summary "Norfold ${PKG_VERSION} for Android." \
            --signing-channel "$CHANNEL" \
            --out release-stage/catalogue.v1.json
          cat release-stage/catalogue.v1.json
      - name: release-manifest.json + checksums
        run: |
          set -euo pipefail
          MIN_SDK=$(grep -E '^\s*minSdkVersion' apps/mobile/android/variables.gradle | grep -oE '[0-9]+')
          TARGET_SDK=$(grep -E '^\s*targetSdkVersion' apps/mobile/android/variables.gradle | grep -oE '[0-9]+')
          CHANNEL=$(node -p "require('./release/state.json').channel")
          node scripts/generate-release-manifest.mjs \
            --tag "$ART_TAG" \
            --apk-dir release-stage \
            --aab "release-stage/Norfold-${ART_TAG}.aab" \
            --version-code "$CODE" \
            --git-sha "$(git rev-parse HEAD)" \
            --min-sdk "$MIN_SDK" \
            --target-sdk "$TARGET_SDK" \
            --facts "$RUNNER_TEMP/apk-facts.json" \
            --signing-channel "$CHANNEL" \
            --out release-stage/release-manifest.json
          cat release-stage/release-manifest.json
          (cd release-stage && sha256sum *.apk *.aab release-manifest.json catalogue.v1.json > SHA256SUMS.txt)
          (cd release-stage && sha256sum -c SHA256SUMS.txt)
          cat release-stage/SHA256SUMS.txt
      - name: Verify consistency (state, packages, lock, catalogue, APK facts)
        # The gate that can block a release must be the one CI tests:
        # scripts/release/verify-consistency.mjs is the canonical cross-artifact
        # check (its suite runs in .github/workflows/ci.yml). This step calls it
        # and reimplements nothing. Runs in dry runs too — a dry run exists to
        # prove the artifacts agree.
        run: |
          set -euo pipefail
          # Both outputs are passed: apk-facts.json does not carry the signing
          # channel, catalogue.v1.json does, so the channel assertion is a real
          # check instead of degrading to "not declared".
          #
          # --tag / --expect-* assert the decision this job was built for, so a
          # resolver/catalogue/APK disagreement fails here, before any upload.
          # Exit 1 = the inputs disagree, exit 2 = a required input is missing or
          # unparseable; both fail this step. No `|| true`, no continue-on-error.
          status=0
          node scripts/release/verify-consistency.mjs \
            --state release/state.json \
            --package package.json \
            --mobile-package apps/mobile/package.json \
            --lock package-lock.json \
            --catalogue release-stage/catalogue.v1.json \
            --apk-facts "$RUNNER_TEMP/apk-facts.json" \
            --tag "v${VERSION}" \
            --expect-version "$VERSION" \
            --expect-version-code "$CODE" || status=$?
          case "$status" in
            0) echo "verify-consistency: state, packages, lock, catalogue and APK facts agree" ;;
            1) echo "::error::verify-consistency: the release artifacts disagree (exit 1) — see the FAIL lines above; nothing was uploaded"; exit 1 ;;
            2) echo "::error::verify-consistency: a required input is missing or unparseable (exit 2) — see the input problems above; nothing was uploaded"; exit 2 ;;
            *) echo "::error::verify-consistency: unexpected exit ${status}"; exit "$status" ;;
          esac
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: findback-signed-${{ github.run_id }}
          path: release-stage/
          # Temporary inter-job transport consumed by the publish job in this
          # same run. 3 days is enough to retry a failed release; the published
          # GitHub Release assets are separate and unaffected.
          retention-days: 3
          if-no-files-found: error
      - name: Step summary (dry run build)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' && needs.decide.outputs.version != '' }}
        # The decision (impact, breakdown, escalated, unparseable, reason,
        # publication switch) is summarised by `decide`. This adds what the dry run
        # built, and says plainly what was mutated and what was not.
        run: |
          {
            echo "### Dry run — built and verified, nothing published"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Rehearsed version | \`${VERSION}\` |"
            echo "| Rehearsed version code | \`${CODE}\` |"
            echo "| APK version stamped | \`$(node -p "require('./apps/mobile/package.json').version")\` |"
            echo "| pendingRelease in the workspace | \`$(node -p "require('./release/state.json').pendingRelease?.tag ?? 'none'")\` |"
            echo
            echo "Runner workspace only: \`package.json\`, \`apps/mobile/package.json\`,"
            echo "\`package-lock.json\` and \`release/state.json\` were rewritten by"
            echo "\`scripts/release/sync-version.mjs\` and the shared pending-release script,"
            echo "so the build and \`scripts/release/verify-consistency.mjs\` saw exactly the"
            echo "content \`prepare\` would have committed."
            echo
            echo "Nothing was committed, tagged, pushed or published; the workspace is discarded."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Create the tag and the GitHub release
    needs: [decide, prepare, build]
    # Runs only after the gate, the prepare commit and the signed/verified build
    # all succeeded, only in publish mode, and only while publication is enabled
    # (a second gate on the switch the resolver already honours). `release_required`
    # is asserted again here rather than inferred from prepare's success.
    if: ${{ needs.build.result == 'success' && needs.prepare.result == 'success' && needs.decide.outputs.release_required == 'true' && needs.decide.outputs.publication_enabled == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'publish') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      published_at: ${{ steps.release.outputs.published_at }}
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      CODE: ${{ needs.decide.outputs.version_code }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      CLASSIFICATION_BASE: ${{ needs.decide.outputs.classification_base }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The prepare commit; the tag is created on exactly this SHA.
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: findback-signed-${{ github.run_id }}
          path: release-files
      - name: Verify the downloaded assets
        run: |
          set -euo pipefail
          ls -l release-files/
          (cd release-files && sha256sum -c SHA256SUMS.txt)
      - name: Create the tag on the prepare commit (never move one)
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if [ -z "$RELEASE_SHA" ]; then echo "::error::no release commit from prepare"; exit 1; fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAGGED_SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
            if [ "$TAGGED_SHA" != "$RELEASE_SHA" ]; then
              echo "::error::tag ${TAG} already exists at ${TAGGED_SHA}, not at the prepared commit ${RELEASE_SHA}; refusing to move it"
              exit 1
            fi
            echo "tag ${TAG} already points at the prepared commit; leaving it in place"
          else
            git tag "$TAG" "$RELEASE_SHA"
            git push origin "refs/tags/${TAG}"
          fi
          git rev-parse "refs/tags/${TAG}^{commit}"
      - name: Create the GitHub release
        id: release
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          CHANNEL=$(node -p "require('./release/state.json').channel")

          PRERELEASE_FLAG=""
          TITLE="Norfold ${TAG}"
          if [ "$CHANNEL" = "beta" ]; then
            PRERELEASE_FLAG="--prerelease"
            TITLE="Norfold ${TAG} (pre-release)"
          fi

          # Curated notes win when the file exists in this tree; otherwise the
          # body is generated from Conventional Commits over the classified
          # range, grouped by type. Nothing about signing, scanning or
          # verification is asserted here — the assets and their checksums are.
          NOTES_FILE="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            BODY_FILE="$NOTES_FILE"
          else
          # The heredoc body and its terminator start at this column so the
          # terminator is the first thing on its line.
          cat > "$RUNNER_TEMP/release-notes.mjs" <<'NODE'
          import { execFileSync } from "node:child_process";

          const [base, head] = process.argv.slice(2);
          // Same type vocabulary the resolver classifies with.
          const GROUPS = [
            ["feat", "Features"],
            ["fix", "Fixes"],
            ["perf", "Performance"],
            ["refactor", "Refactors"],
            ["docs", "Documentation"],
            ["test", "Tests"],
            ["build", "Build"],
            ["ci", "CI"],
            ["chore", "Chores"],
            ["style", "Style"],
            ["revert", "Reverts"],
          ];
          const SUBJECT = /^([a-z]+)(?:\(([^()\r\n]*)\))?(!)?: +(\S.*)$/;
          const MERGE = /^Merge (?:pull request #\d+|branch\b|remote-tracking branch\b|tag\b)/;
          const GENERATED_REVERT = /^Revert "[^"]+"$/;

          const raw = execFileSync("git", ["log", "--format=%s%x1f%b%x1e", `${base}..${head}`], {
            encoding: "utf8",
          });

          const grouped = new Map(GROUPS.map(([type]) => [type, []]));
          for (const chunk of raw.split("\x1e")) {
            const text = chunk.replace(/^\n+/, "").trimEnd();
            if (text.trim() === "") continue;
            const subject = text.split("\x1f")[0].trim();
            if (MERGE.test(subject) || GENERATED_REVERT.test(subject)) continue;
            const match = SUBJECT.exec(subject);
            if (match === null) continue;
            const type = match[1];
            if (type === "chore" && /^chore\(release\):/.test(subject)) continue;
            grouped.get(type)?.push(subject);
          }

          const lines = [];
          for (const [type, heading] of GROUPS) {
            const items = grouped.get(type) ?? [];
            if (items.length === 0) continue;
            lines.push(`### ${heading}`, "", ...items.map((item) => `- ${item}`), "");
          }
          if (lines.length > 0) {
            process.stdout.write(
              `${lines.join("\n").trimEnd()}\n\nSee release-manifest.json for versionCode, git SHA, and per-artifact checksums.\n`,
            );
          }
          NODE

            BODY=$(node "$RUNNER_TEMP/release-notes.mjs" "$CLASSIFICATION_BASE" "$RELEASE_SHA")
            if [ -n "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$BODY" > "$RUNNER_TEMP/release-body.md"
            else
              printf 'Norfold %s\n\nSee release-manifest.json for versionCode, git SHA, and per-artifact checksums.\n' \
                "$TAG" > "$RUNNER_TEMP/release-body.md"
            fi
            BODY_FILE="$RUNNER_TEMP/release-body.md"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; leaving it untouched (no edit, no delete)"
          else
            # Intentional word-splitting: PRERELEASE_FLAG is empty (stable) or
            # --prerelease (channel "beta").
            # shellcheck disable=SC2086
            gh release create "$TAG" $PRERELEASE_FLAG \
              --title "$TITLE" \
              --notes-file "$BODY_FILE" \
              release-files/*.apk release-files/*.aab \
              release-files/release-manifest.json release-files/catalogue.v1.json release-files/SHA256SUMS.txt
          fi

          # The state's `publishedAt` must equal the release record itself, not
          # the moment this job happened to run, so it is read back from GitHub.
          # There is deliberately no local-time fallback: a release whose
          # timestamp cannot be read fails here instead of writing a wrong value.
          PUBLISHED_AT=""
          for attempt in 1 2 3; do
            PUBLISHED_AT=$(gh release view "$TAG" --json publishedAt --jq .publishedAt 2>/dev/null || true)
            if [ -n "$PUBLISHED_AT" ] && [ "$PUBLISHED_AT" != "null" ]; then break; fi
            PUBLISHED_AT=""
          done
          if [ -z "$PUBLISHED_AT" ]; then
            echo "::error::cannot read ${TAG}'s publishedAt from GitHub; refusing to invent a timestamp"
            exit 1
          fi
          echo "published_at=${PUBLISHED_AT}" >> "$GITHUB_OUTPUT"
          echo "published ${TAG} at ${PUBLISHED_AT}" >> "$GITHUB_STEP_SUMMARY"

  finalize:
    name: Finalise the release state
    needs: [decide, prepare, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      CODE: ${{ needs.decide.outputs.version_code }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      PUBLISHED_AT: ${{ needs.publish.outputs.published_at }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Promote the pending release and commit
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SHA" ]; then echo "::error::no release commit from prepare"; exit 1; fi
          if [ -z "$PUBLISHED_AT" ]; then echo "::error::publish produced no timestamp"; exit 1; fi

          cat > "$RUNNER_TEMP/finalize-state.mjs" <<'NODE'
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";

          const [version, code, commit, publishedAt] = process.argv.slice(2);
          const repo = process.cwd();
          const { loadState, writeState } = await import(
            pathToFileURL(resolve(repo, "scripts/release/state.mjs")).href
          );

          const state = loadState(repo);
          const versionCode = Number(code);
          const next = {
            ...state,
            version,
            versionCode,
            // The next classification starts at the published commit, so the
            // commits that shipped in this release are never released twice.
            classificationBase: commit,
            pendingRelease: null,
            lastRelease: {
              tag: `v${version}`,
              version,
              versionCode,
              commit,
              publishedAt,
            },
          };
          writeState(repo, next);
          console.log(`release/state.json: version ${version}, code ${versionCode}, pendingRelease cleared`);
          NODE

          node "$RUNNER_TEMP/finalize-state.mjs" "$VERSION" "$CODE" "$RELEASE_SHA" "$PUBLISHED_AT"

          git add release/state.json
          git commit -m "chore(release): finalise v${VERSION}"

          if ! git push origin HEAD:main; then
            echo "push to main was rejected; rebasing the finalise commit onto origin/main once"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          echo "finalised v${VERSION} at $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
